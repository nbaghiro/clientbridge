[project]
name = "clientbridge"
version = "0.1.0"
description = "Clientbridge backend — FastAPI + SQLAlchemy + Alembic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "python-ulid>=2.2",
    "arq>=0.26",
    "httpx>=0.27",
    "stripe>=10.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "asgi-lifespan>=2"]

[tool.coverage.run]
branch = true
source = ["clientbridge"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clientbridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true                 # disallow_untyped_defs, disallow_any_generics, no_implicit_optional, warn_return_any, …
warn_unreachable = true
exclude = ["migrations/"]
# "No Any" is enforced two ways: mypy strict bans *implicit* Any (untyped defs, bare generics,
# returning Any); ruff ANN401 bans *explicit* `Any` in our signatures. Together = no Any in our code.

# Third-party libs that ship no type stubs — don't fail on their imports (our code stays strict).
[[tool.mypy.overrides]]
module = ["argon2.*", "ulid.*", "arq.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
