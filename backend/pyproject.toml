[project]
name = "clientbridge"
version = "0.1.0"
description = "Clientbridge backend — FastAPI + SQLAlchemy + Alembic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "cryptography>=42",
    "python-ulid>=2.2",
    "arq>=0.26",
    "httpx>=0.27",
    "stripe>=16.0",
    "boto3>=1.34",
    "babel==2.17.0",
    "tzdata==2026.5",
    "google-cloud-kms>=3.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-randomly>=3.15",
    "ruff>=0.6",
    # pinned so make, the pre-commit hook and CI type-check with one version
    "pyright==1.1.408",
    "asgi-lifespan>=2",
]

[tool.coverage.run]
branch = true
source = ["clientbridge"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clientbridge"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "clientbridge/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Deterministic by default (pytest-randomly installed so this is a real switch, not a no-op).
# Drop `-p no:randomly` ad hoc to surface order-coupling. contract/e2e need an external service
# (stripe-mock / Stripe test keys / the auth service) so they're out of the default run — see `make test-contract`.
addopts = "-p no:randomly -m 'not contract and not e2e and not kratos'"
markers = [
    "kratos: real KratosIdentityProvider against the local Kratos (`make up`)",
    "contract: real StripeGateway against stripe-mock (start it with `make stripe-mock`)",
    "e2e: Stripe and Resend test-mode flows; skipped unless the provider's test key is set",
    "wall_clock: runs at real time, for tests against a clock outside the app (the auth service, Stripe, Resend)",
]
