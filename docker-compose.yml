# The `app` profile runs the prod images against these services the way the cluster runs them:
# `make up-app`, with the API on :8750 and the web image on :8751 (see .docs/engineering.md).
x-backend: &backend
  build: { context: ., dockerfile: backend/Dockerfile, target: prod }
  image: clientbridge-backend:local
  profiles: ["app"]
  depends_on:
    postgres:
      condition: service_healthy
  environment: &backend-env
    ENV: dev
    DATABASE_URL: postgresql+asyncpg://clientbridge_api:clientbridge_api@postgres:5432/${APP_DATABASE:-clientbridge}
    MIGRATION_DATABASE_URL: postgresql+asyncpg://clientbridge_migrator:clientbridge_migrator@postgres:5432/${APP_DATABASE:-clientbridge}
    ADMIN_DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@postgres:5432/${APP_DATABASE:-clientbridge}
    POWERSYNC_SOURCE_PASSWORD: ${POWERSYNC_SOURCE_PASSWORD:-powersync_source}
    POWERSYNC_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:-powersync_storage_owner}
    AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    REDIS_URL: redis://redis:6379/1   # its own queue, so a dev worker on db 0 never takes its jobs
    AUTH_PUBLIC_URL: http://auth:4433
    AUTH_ADMIN_URL: http://auth:4434
    AUTH_EMAIL_HOOK_SECRET: ${AUTH_EMAIL_HOOK_SECRET:-clientbridge-dev-courier-secret-do-not-use-in-prod}
    S3_ENDPOINT: http://s3:9000
    S3_BUCKET: clientbridge
    S3_ACCESS_KEY: rustfs
    S3_SECRET_KEY: rustfs-dev-secret
    S3_REGION: us-east-1
    SMTP_URL: smtp://mailpit:1025
    API_BASE_URL: http://localhost:8750
    WEB_BASE_URL: http://localhost:8751
    CONNECT_BASE_URL: http://book.localhost:8751
    PAY_BASE_URL: http://pay.localhost:8751
    CORS_ALLOW_ORIGINS: http://book.localhost:8751,http://pay.localhost:8751,http://shop.localhost:8751
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}

services:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
    environment:
      POSTGRES_USER: clientbridge
      POSTGRES_PASSWORD: clientbridge
      POSTGRES_DB: clientbridge
    ports: ["8702:5432"]   # host 8702 → pg 5432 (Clientbridge 87xx block)
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientbridge -d clientbridge"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Self-hosted PowerSync. Replicates the clientbridge DB's WAL; bucket storage lives in a SEPARATE
  # database on the same Postgres (powersync_storage) — both created by `make up`.
  powersync:
    image: journeyapps/powersync-service@sha256:413a0c813e96935ebe7203b5759f8a594a7b7cd8aa42134713e63af637e0f079
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8704:8080"]   # host 8704 → powersync 8080
    volumes: ["./infra/powersync:/config:ro"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    command: ["start", "-r", "unified"]

  # The auth service (Ory Kratos) owns credentials and sessions, in the separate `auth` database
  # created by `make up` (scripts/db_access.py).
  auth-migrate:
    image: &auth-image oryd/kratos@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643  # infra/auth/standalone.sh reads this pin too
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://auth:${AUTH_DB_PASSWORD:-auth}@postgres:5432/auth?sslmode=disable
    command: ["migrate", "sql", "up", "-e", "--yes"]

  auth:
    image: *auth-image
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    ports: ["8713:4433", "127.0.0.1:8714:4434"]   # host 8713 → public API, 8714 → admin API (never public)
    volumes: ["./infra/auth:/etc/config/auth:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # the courier posts auth email to the host API
    environment:
      DSN: postgres://auth:${AUTH_DB_PASSWORD:-auth}@postgres:5432/auth?sslmode=disable
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-unset}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-unset}
      # No secret in kratos.yml: a deploy that forgets these refuses to start.
      SECRETS_COOKIE: ${AUTH_COOKIE_SECRET:-clientbridge-dev-cookie-secret-do-not-use-in-prod}
      SECRETS_CIPHER: ${AUTH_CIPHER_SECRET:-clientbridge-dev-cipher-key-0032}
      COURIER_HTTP_REQUEST_CONFIG_AUTH_CONFIG_VALUE: ${AUTH_EMAIL_HOOK_SECRET:-clientbridge-dev-courier-secret-do-not-use-in-prod}
      # the breach lookup calls an outside API with a one-second budget and fails sign-ups when it is slow
      SELFSERVICE_METHODS_PASSWORD_CONFIG_HAVEIBEENPWNED_ENABLED: "false"
    command: ["serve", "-c", "/etc/config/auth/kratos.yml", "--dev", "--watch-courier"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4434/admin/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches the API's email in dev (the ENV=dev default for SMTP_URL); the UI is on :8715.
  mailpit:
    image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports: ["127.0.0.1:8715:8025", "127.0.0.1:8716:1025"]   # host 8715 → web UI and API, 8716 → SMTP

  # Contract-test only (profile "test"): the official OpenAPI mock. `make stripe-mock` starts it;
  # the real StripeGateway runs against it to validate request/response shapes against the live spec.
  stripe-mock:
    image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78  # v0.206.0
    profiles: ["test"]
    ports: ["8708:12111"]   # host 8708 → stripe-mock 12111 (http)

  # Deploy only (profile "deploy", never started locally): the Cloud SQL Auth Proxy pin the cluster's
  # sidecars run, kept here so infra/pulumi reads every upstream pin from this file.
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy@sha256:86e4f3cc266020e7ee07740df78d7511e2c340c274b56f84d80b7251913af9ad  # 2.26.0
    profiles: ["deploy"]

  redis:
    image: redis@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    ports: ["8703:6379"]   # host 8703 → redis 6379

  s3:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c   # S3-compatible; MinIO no longer publishes free images
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
      # Presigned URLs carry the credential; a redirected browser fetch arrives with Origin: null.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports: ["8705:9000", "8706:9001"]   # host 8705 → S3 API, 8706 → console
    volumes: ["s3data:/data"]

  migrate:
    <<: *backend
    command: ["migrate"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports: ["8750:8701"]   # host 8750 → the API image (dev-api keeps 8701)

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: ["arq", "clientbridge.tasks.worker.WorkerSettings"]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    image: clientbridge-web:local
    profiles: ["app"]
    ports: ["8751:8080"]   # host 8751 → Caddy, which routes by host
    environment:
      BASE_DOMAIN: localhost
      ENVIRONMENT: development
      # the app stays on localhost so the auth session cookie on localhost reaches it, as with dev-web
      APP_HOST: localhost
      SITE_HOST: site.localhost
      SITE_URL: http://site.localhost:8751
      APP_URL: http://localhost:8751
      BOOK_URL: http://book.localhost:8751
      PAY_URL: http://pay.localhost:8751
      # config.js names these, since the hosts derived from BASE_DOMAIN are https and unrouted here
      API_URL: http://localhost:8750
      AUTH_URL: http://localhost:8713
      SYNC_URL: http://localhost:8704
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}

volumes:
  pgdata: {}
  s3data: {}
