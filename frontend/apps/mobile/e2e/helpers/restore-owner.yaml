appId: '${typeof APP_ID === "undefined" ? "ca.clientbridge.app" : APP_ID}'
---
- launchApp:
      arguments:
          RCT_jsLocation: '${typeof METRO_HOST === "undefined" ? "localhost:8707" : METRO_HOST}'
      # the default "all" pulls the whole APK over adb to read its manifest, which can stall for minutes
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today|Sign in"
      timeout: 60000
- runFlow:
      when:
          visible: "Today"
      commands:
          - tapOn: "Setup"
          - scrollUntilVisible:
                element: "Sign out"
                direction: DOWN
          - tapOn: "Sign out"
          - extendedWaitUntil:
                visible: "Sign in"
                timeout: 30000
- runFlow: owner.yaml
- assertVisible: "Booked today.*"
