appId: ${APP_ID}
---
# iOS offers to save a password it hasn't seen, and every run signs in with its own namespaced login
- runFlow:
      when:
          platform: iOS
      commands:
          - extendedWaitUntil:
                visible: "Save Password\\?"
                timeout: 15000
                optional: true
          - runFlow:
                when:
                    visible: "Not Now"
                commands:
                    - tapOn: "Not Now"
