appId: ${APP_ID}
---
# adds ITEM to the open invoice from the catalog, which brings its price and tax class
- scrollUntilVisible:
      element: "Add from catalog"
      direction: DOWN
- tapOn: "Add from catalog"
# a long catalog runs past the sheet; searching would raise a keyboard that hides a short one
- scrollUntilVisible:
      element: ${ITEM + " · .*"}
      direction: DOWN
      timeout: 60000
- tapOn: ${ITEM + " · .*"}
