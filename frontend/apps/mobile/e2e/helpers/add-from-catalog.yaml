appId: ${APP_ID}
---
# adds ITEM to the open invoice from the catalog, which brings its price and tax class
# swipes along the edge, since a swipe from the middle lands on a line's fields and doesn't scroll
- repeat:
      times: 20
      while:
          notVisible: "Add from catalog"
      commands:
          - swipe:
                start: "3%,70%"
                end: "3%,45%"
- tapOn: "Add from catalog"
- extendedWaitUntil:
      visible: ${ITEM + " · .*"}
      timeout: 60000
- tapOn: ${ITEM + " · .*"}
