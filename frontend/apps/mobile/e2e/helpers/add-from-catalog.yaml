appId: ${APP_ID}
---
# adds ITEM to the open invoice from the catalog, which brings its price and tax class
- scrollUntilVisible:
      element: "Add from catalog"
      direction: DOWN
- tapOn: "Add from catalog"
# a long catalog runs past the sheet, so the item is searched for by its first word
- tapOn: "Search"
- inputText: ${ITEM.split(" ")[0]}
- extendedWaitUntil:
      visible: ${ITEM + " · .*"}
      timeout: 60000
- tapOn: ${ITEM + " · .*"}
