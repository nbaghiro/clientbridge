appId: ${APP_ID}
---
- launchApp:
      # the default "all" pulls the whole APK over adb to read its manifest, which can stall for minutes
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today|Sign in"
      timeout: 60000
- runFlow:
      when:
          visible: "Sign in"
      commands:
          - tapOn: "you@business.ca"
          - inputText: "hannah+${E2E_NAMESPACE}@birchbark.example"
          - tapOn: "••••••••"
          - eraseText
          - inputText: "demo1234"
          - hideKeyboard
          - tapOn:
                text: "Sign in"
                below: "Forgot password\\?"
          - runFlow: decline-save-password.yaml
- extendedWaitUntil:
      visible: "Today"
      timeout: 60000
# the viewer's name arrives with the replica's first sync, after Today renders
- extendedWaitUntil:
      visible: "Good .*, Hannah"
      timeout: 90000
