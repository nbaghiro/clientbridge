appId: ${APP_ID}
name: Owner client record surfaces
---
- runFlow: helpers/owner.yaml
- tapOn: "Clients"
- tapOn: "Search name, phone or pet"
- inputText: "Olivia"
- hideKeyboard
- tapOn: ".*Olivia Martin.*"
- extendedWaitUntil:
      visible: "Book"
      timeout: 60000
- assertVisible: "Balance due"
- takeScreenshot: client-record
- tapOn: "History"
- assertVisible: "Money.*"
- takeScreenshot: client-history
- tapOn: "Back|Go back|Navigate up"
- tapOn: ".*Olivia Martin.*"
- extendedWaitUntil:
      visible: "Book"
      timeout: 60000
# iOS calls Manage visible while it sits under the sticky actions, where a tap lands on Edit
- swipe:
      start: "50%,70%"
      end: "50%,25%"
      duration: 500
- tapOn: "Manage"
- assertVisible: "Payment methods"
- takeScreenshot: client-wallet
- tapOn: "Back|Go back|Navigate up"
- tapOn: ".*Olivia Martin.*"
- tapOn:
      text: "Pets"
      below: "Edit Bandit"
- assertVisible: "Add pet"
- takeScreenshot: client-pets
