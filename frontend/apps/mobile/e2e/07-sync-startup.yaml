appId: ca.clientbridge.app
name: Offline hours survive a process restart
onFlowComplete:
    - setAirplaneMode: disabled
---
- runFlow: helpers/owner.yaml
- tapOn: "Setup"
- tapOn: "Team & hours"
- scrollUntilVisible:
      element: "Regular hours"
      direction: DOWN
- scrollUntilVisible:
      element: "Save hours"
      direction: DOWN
- assertNotVisible: "This didn't load."
- takeScreenshot: scoped-hours-ready

- setAirplaneMode: enabled
- tapOn: "Save hours"
- extendedWaitUntil:
      visible: "Saved on this device.*"
      timeout: 15000
- stopApp
- launchApp:
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today"
      timeout: 60000
- tapOn: "Setup"
- tapOn: "Team & hours"
- scrollUntilVisible:
      element: "Saved on this device.*"
      direction: DOWN
- setAirplaneMode: disabled
- extendedWaitUntil:
      notVisible: "Saved on this device.*"
      timeout: 60000
- assertNotVisible: "Sync needs attention"
