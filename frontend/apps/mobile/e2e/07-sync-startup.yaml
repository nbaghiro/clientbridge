appId: '${typeof APP_ID === "undefined" ? "ca.clientbridge.app" : APP_ID}'
name: Offline hours survive a process restart
tags:
    - lane
onFlowComplete:
    - runScript:
          file: helpers/control.js
          env:
              ACTION: online
---
- runFlow: helpers/owner.yaml
- tapOn: "Setup"
- tapOn: "Team & hours"
- scrollUntilVisible:
      element: "Regular hours"
      direction: DOWN
- scrollUntilVisible:
      element: "Save hours"
      direction: DOWN
- assertNotVisible: "This didn't load."
- takeScreenshot: scoped-hours-ready

- runScript:
      file: helpers/control.js
      env:
          ACTION: offline
- tapOn: "Save hours"
- extendedWaitUntil:
      visible: "Saved on this device.*"
      timeout: 15000
- stopApp
- launchApp:
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today"
      timeout: 60000
- tapOn: "Setup"
- tapOn: "Team & hours"
- scrollUntilVisible:
      element: "Saved on this device.*"
      direction: DOWN
- runScript:
      file: helpers/control.js
      env:
          ACTION: online
- extendedWaitUntil:
      notVisible: "Saved on this device.*"
      timeout: 60000
- assertNotVisible: "Sync needs attention"
