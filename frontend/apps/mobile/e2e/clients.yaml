appId: ${APP_ID}
name: NATIVE-CRM-01 Native client creation and editing survive process restarts
---
- evalScript: ${output.clientName = "Sophie Bennett"}
- evalScript: ${output.editedName = "Sophie Laurent"}
# a fresh number outside 555, so no earlier run's client already has it
- evalScript: ${output.clientExchange = String(700 + Math.floor(Math.random() * 200))}
- evalScript: ${output.clientLine = String(1000 + Math.floor(Math.random() * 9000))}
- evalScript: ${output.clientPhone = "250" + output.clientExchange + output.clientLine}
- evalScript: ${output.clientPhoneLabel = "(250) " + output.clientExchange + "-" + output.clientLine}
- runFlow: helpers/owner.yaml
- tapOn: "Clients"
- tapOn: "Add"
- assertVisible: "Add client"
- tapOn: "First and last name"
- inputText: ${output.clientName}
- tapOn: "250 555 0100"
- inputText: ${output.clientPhone}
- hideKeyboard
- tapOn: "Add"
- extendedWaitUntil:
      visible: "Book"
      timeout: 60000
- assertVisible: ${output.clientName}
- takeScreenshot: native-client-created
- stopApp
- runFlow: helpers/owner.yaml
- tapOn: "Clients"
- tapOn: "Search name, phone or pet"
- inputText: ${output.clientPhone}
- hideKeyboard
- extendedWaitUntil:
      visible: ${".*" + output.clientName + ".*"}
      timeout: 60000
- tapOn: ${".*" + output.clientName + ".*"}
- tapOn: "Edit"
- extendedWaitUntil:
      visible: "Edit client"
      timeout: 15000
- assertVisible: ${output.clientPhoneLabel}
- tapOn:
      text: ${output.clientName}
      point: "95%,50%"
- eraseText: 100
- inputText: ${output.editedName}
- assertVisible: ${output.editedName}
- hideKeyboard
- tapOn: "Done"
- extendedWaitUntil:
      visible: ${output.editedName}
      timeout: 60000
- assertNotVisible: "Edit client"
- stopApp
- runFlow: helpers/owner.yaml
- tapOn: "Clients"
- tapOn: "Search name, phone or pet"
- inputText: ${output.clientPhone}
- hideKeyboard
- extendedWaitUntil:
      visible: ${".*" + output.editedName + ".*"}
      timeout: 60000
- assertNotVisible: ${".*" + output.clientName + ".*"}
- tapOn: ${".*" + output.editedName + ".*"}
- assertVisible: "Book"
- tapOn: "Edit"
- assertVisible: "Edit client"
- assertVisible: ${output.clientPhoneLabel}
- assertVisible: ${output.editedName}
- tapOn: "Cancel"
- takeScreenshot: native-client-edited-after-restart
