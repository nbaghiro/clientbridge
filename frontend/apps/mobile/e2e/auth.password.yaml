appId: ${APP_ID}
name: NATIVE-AUTH-01 Signing in again after the password changed on another device
onFlowComplete:
    - runScript: helpers/forget-recovery-account.js
    - runFlow: helpers/restore-owner.yaml
---
- runScript: helpers/password-account.js
- launchApp:
      # the default "all" pulls the whole APK over adb to read its manifest, which can stall for minutes
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today|Sign in"
      timeout: 60000
- runFlow:
      when:
          visible: "Today"
      commands:
          - tapOn: "Setup"
          - scrollUntilVisible:
                element: "Sign out"
                direction: DOWN
          - tapOn: "Sign out"
          - extendedWaitUntil:
                visible: "Sign in"
                timeout: 30000
- tapOn: "you@business.ca"
- inputText: ${output.recovery.email}
- tapOn: "••••••••"
- eraseText
- inputText: ${output.recovery.password}
- hideKeyboard
- tapOn:
      text: "Sign in"
      below: "Forgot password\\?"
- runFlow: helpers/decline-save-password.yaml
- extendedWaitUntil:
      visible: "Create your business"
      timeout: 60000
- runScript: helpers/change-password.js
- stopApp
- launchApp:
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Sign in"
      timeout: 60000
- assertNotVisible: "Create your business"
- takeScreenshot: password-changed-signed-out
- tapOn: "you@business.ca"
- inputText: ${output.recovery.email}
- tapOn: "••••••••"
- eraseText
- inputText: ${output.recovery.password}
- hideKeyboard
- tapOn:
      text: "Sign in"
      below: "Forgot password\\?"
- extendedWaitUntil:
      visible: "That email and password don't match\\. Try again or reset your password\\."
      timeout: 30000
- takeScreenshot: old-password-refused
- tapOn: "Password"
- eraseText
- inputText: ${output.recovery.newPassword}
- hideKeyboard
- tapOn:
      text: "Sign in"
      below: "Forgot password\\?"
- runFlow: helpers/decline-save-password.yaml
- extendedWaitUntil:
      visible: "Create your business"
      timeout: 60000
- takeScreenshot: new-password-signed-in
- scrollUntilVisible:
      element: "Not you\\? Sign out"
      direction: DOWN
- tapOn: "Not you\\? Sign out"
- extendedWaitUntil:
      visible: "Sign in"
      timeout: 30000
