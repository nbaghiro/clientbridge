appId: ${APP_ID}
name: NATIVE-CFG-01 Photos picked on the phone upload, save and become the business logo and cover
---
- addMedia:
      - "assets/logo.png"
- runFlow: helpers/owner.yaml
- tapOn: "Setup"
- tapOn: "Get set up"
# a checklist row's accessible name is its label and its action together
- scrollUntilVisible:
      element: ".*Edit brand"
      direction: DOWN
- tapOn: ".*Edit brand"
- extendedWaitUntil:
      visible: "Replace logo"
      timeout: 60000
- tapOn: "Replace logo"
- runFlow: helpers/pick-photo.yaml
# the notice only appears once the server has confirmed the bytes and the logo changed
- scrollUntilVisible:
      element: "You have unsaved brand changes."
      direction: DOWN
      timeout: 60000
- takeScreenshot: brand-logo-uploaded
- scrollUntilVisible:
      element: "Upload cover photo"
      direction: UP
- tapOn: "Upload cover photo"
- runFlow: helpers/pick-photo.yaml
# the label only changes once the server has confirmed the bytes
- extendedWaitUntil:
      visible: "Replace cover photo"
      timeout: 60000
- takeScreenshot: brand-cover-uploaded
- scrollUntilVisible:
      element: "Save brand"
      direction: DOWN
- tapOn: "Save brand"
- extendedWaitUntil:
      visible: "Saved. Your booking page uses it now."
      timeout: 60000
- takeScreenshot: brand-photos-saved
