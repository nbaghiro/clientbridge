appId: ${APP_ID}
name: NATIVE-CFG-01 Photos picked on the phone upload, save and become the business logo and cover
---
- addMedia:
      - "assets/logo.png"
- runFlow: helpers/owner.yaml
- tapOn: "Setup"
- tapOn: "Get set up"
# a checklist row's accessible name is its label and its action together
- scrollUntilVisible:
      element: ".*Edit brand"
      direction: DOWN
- tapOn: ".*Edit brand"
- extendedWaitUntil:
      visible: "Replace logo"
      timeout: 60000
- runFlow:
      file: helpers/pick-photo.yaml
      env:
          OPENS: "Replace logo"
# the cover button stays disabled until the server has confirmed the logo's bytes
- scrollUntilVisible:
      element: "Upload cover photo"
      direction: DOWN
- extendedWaitUntil:
      visible:
          text: "Upload cover photo"
          enabled: true
      timeout: 60000
- takeScreenshot: brand-logo-uploaded
- runFlow:
      file: helpers/pick-photo.yaml
      env:
          OPENS: "Upload cover photo"
# the label only changes once the server has confirmed the bytes
- extendedWaitUntil:
      visible: "Replace cover photo"
      timeout: 60000
- takeScreenshot: brand-cover-uploaded
# along the sheet's edge, because on a small screen a swipe from the centre lands on a field and moves only its text
- repeat:
      times: 40
      while:
          notVisible: "Save brand"
      commands:
          - swipe:
                start: "3%,80%"
                end: "3%,20%"
- assertVisible: "You have unsaved brand changes."
- tapOn: "Save brand"
- extendedWaitUntil:
      visible: "Saved. Your booking page uses it now."
      timeout: 60000
- takeScreenshot: brand-photos-saved
