appId: ${APP_ID}
name: NATIVE-IOS-02 The device replica opens a client record with no server reachable
tags:
    - lane
onFlowComplete:
    - runScript:
          file: helpers/control.js
          env:
              ACTION: online
---
- runFlow: helpers/owner.yaml
- tapOn: "Clients"
- tapOn: "Search name, phone or pet"
- inputText: "Olivia Martin"
- hideKeyboard
- extendedWaitUntil:
      visible: ".*Olivia Martin.*"
      timeout: 60000
- runScript:
      file: helpers/control.js
      env:
          ACTION: offline
- stopApp
- launchApp:
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today"
      timeout: 60000
- assertNotVisible: "Sign in"
- tapOn: "Clients"
- tapOn: "Search name, phone or pet"
- inputText: "Olivia Martin"
- hideKeyboard
- extendedWaitUntil:
      visible: ".*Olivia Martin.*"
      timeout: 30000
- tapOn: ".*Olivia Martin.*"
- assertVisible: "Book"
- assertVisible: "Bandit"
- takeScreenshot: offline-client-record
- runScript:
      file: helpers/control.js
      env:
          ACTION: online
