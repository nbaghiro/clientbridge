appId: ${APP_ID}
name: NATIVE-CFG-02 Getting paid names what Stripe needs while payouts are paused, why it rejected a detail, and a payout bank that turned a payout down or isn't in CAD
tags:
    - lane
onFlowComplete:
    - runScript:
          file: helpers/control.js
          env:
              ACTION: account
              PAYLOAD: ready
---
- runScript:
      file: helpers/control.js
      env:
          ACTION: account
          PAYLOAD: paused
- runFlow: helpers/owner.yaml
- tapOn: "Setup"
- scrollUntilVisible:
      element: "Getting paid"
      direction: DOWN
- tapOn: "Getting paid"
- assertVisible: "Payouts are paused"
- assertVisible: "You can still take card payments, but your payouts are on hold until you send what's listed below."
- scrollUntilVisible:
      element: "Overdue"
      direction: DOWN
- assertVisible: "Bank account for payouts"
- takeScreenshot: getting-paid-paused
- tapOn: "Back|Go back|Navigate up"
- runScript:
      file: helpers/control.js
      env:
          ACTION: account
          PAYLOAD: due
- tapOn: "Getting paid"
- assertVisible: "You're set up to get paid"
- assertVisible: "Card payments, Tap to Pay and payouts are all on. Send what's listed below to keep them that way."
- scrollUntilVisible:
      element: "The name, date of birth and ID number didn't match. Check them and send them again."
      direction: DOWN
- assertVisible: "ID number \\(SIN\\)"
- takeScreenshot: getting-paid-rejected
- tapOn: "Back|Go back|Navigate up"
- runScript:
      file: helpers/control.js
      env:
          ACTION: account
          PAYLOAD: declined
- tapOn: "Getting paid"
- assertVisible: "Payouts are paused"
- assertVisible: "You can still take card payments, but your bank turned down your last payout. Payouts are on hold until you update your bank details."
- scrollUntilVisible:
      element: "Your bank turned down the last payout. Check the account details, or add a different account."
      direction: DOWN
- scrollUntilVisible:
      element: "Held until your bank is updated"
      direction: DOWN
- takeScreenshot: getting-paid-bank-declined
- tapOn: "Back|Go back|Navigate up"
- runScript:
      file: helpers/control.js
      env:
          ACTION: account
          PAYLOAD: foreign
- tapOn: "Getting paid"
- assertVisible: "Card payments, Tap to Pay and payouts are on, but your payouts go to a bank account in another currency. Stripe converts each one, and Clientbridge can't track them. Add a Canadian-dollar account."
- scrollUntilVisible:
      element: "This account isn't in Canadian dollars. Add a Canadian-dollar chequing account for your payouts."
      direction: DOWN
- takeScreenshot: getting-paid-foreign-bank
