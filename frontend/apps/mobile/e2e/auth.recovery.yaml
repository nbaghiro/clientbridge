appId: ${APP_ID}
name: Password recovery
onFlowComplete:
    - runScript: helpers/forget-recovery-account.js
    - runFlow: helpers/restore-owner.yaml
---
- runScript: helpers/recovery-account.js
- launchApp:
      # the default "all" pulls the whole APK over adb to read its manifest, which can stall for minutes
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today|Sign in"
      timeout: 60000
- runFlow:
      when:
          visible: "Today"
      commands:
          - tapOn: "Setup"
          - scrollUntilVisible:
                element: "Sign out"
                direction: DOWN
          - tapOn: "Sign out"
          - extendedWaitUntil:
                visible: "Sign in"
                timeout: 30000
- tapOn: "you@business.ca"
- inputText: ${output.recovery.email}
# the email field doesn't submit, so Return only puts the keyboard away where iOS's hideKeyboard can't
- runFlow:
      when:
          platform: iOS
      commands:
          - pressKey: Enter
- runFlow:
      when:
          platform: Android
      commands:
          - hideKeyboard
- tapOn: "Forgot password\\?"
- assertVisible: "Reset your password"
- tapOn: "Send code"
- extendedWaitUntil:
      visible: "Check your email"
      timeout: 30000
- runScript:
      file: helpers/mailed-code.js
      env:
          EMAIL: ${output.recovery.email}
- tapOn: "123456"
- inputText: ${output.code}
- runFlow:
      file: helpers/submit.yaml
      env:
          BUTTON: "Continue"
- extendedWaitUntil:
      visible: "Choose a new password"
      timeout: 30000
- takeScreenshot: recovery-new-password
- tapOn:
      text: "Create a password"
      index: 1
- inputText: ${output.recovery.password}
- runFlow:
      file: helpers/submit.yaml
      env:
          BUTTON: "Save password"
- runFlow: helpers/decline-save-password.yaml
- extendedWaitUntil:
      visible: "Create your business"
      timeout: 60000
- takeScreenshot: recovery-signed-in
- scrollUntilVisible:
      element: "Not you\\? Sign out"
      direction: DOWN
- tapOn: "Not you\\? Sign out"
- extendedWaitUntil:
      visible: "Sign in"
      timeout: 30000
