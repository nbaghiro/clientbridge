appId: ${APP_ID}
name: NATIVE-AUTH-03 An account whose only second step is a security key is told to add another one on the web
tags:
    - lane
onFlowComplete:
    - runScript: helpers/forget-recovery-account.js
    - runFlow: helpers/restore-owner.yaml
---
- runScript: helpers/password-account.js
- runScript:
      file: helpers/control.js
      env:
          ACTION: key
          PAYLOAD: "${JSON.stringify({ email: output.recovery.email, password: output.recovery.password })}"
- launchApp:
      # the default "all" pulls the whole APK over adb to read its manifest, which can stall for minutes
      permissions:
          notifications: allow
- extendedWaitUntil:
      visible: "Today|Sign in"
      timeout: 60000
- runFlow:
      when:
          visible: "Today"
      commands:
          - tapOn: "Setup"
          - scrollUntilVisible:
                element: "Sign out"
                direction: DOWN
          - tapOn: "Sign out"
          - extendedWaitUntil:
                visible: "Sign in"
                timeout: 30000
- tapOn: "you@business.ca"
- inputText: ${output.recovery.email}
- tapOn: "••••••••"
- eraseText
- inputText: ${output.recovery.password}
- runFlow: helpers/sign-in.yaml
- runFlow: helpers/decline-save-password.yaml
- extendedWaitUntil:
      visible: "This account's second step is a security key, which works only in the web app\\..*"
      timeout: 60000
- assertNotVisible: "Create your business"
- takeScreenshot: key-only-account
- tapOn: "Sign in as someone else"
- extendedWaitUntil:
      visible: "Sign in"
      timeout: 30000
