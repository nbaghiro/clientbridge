name: e2e web
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium (1/3), artifact: web-chromium-1, browser: chromium, args: --surface web --shard 1/3 }
          - { name: chromium (2/3), artifact: web-chromium-2, browser: chromium, args: --surface web --shard 2/3 }
          - { name: chromium (3/3), artifact: web-chromium-3, browser: chromium, args: --surface web --shard 3/3 }
          - { name: pseudo-locale, artifact: web-pseudo, browser: chromium, args: --surface web --project pseudo }
          # Firefox and WebKit run only the cases tagged @browsers; CI keeps them on Linux
          - { name: firefox, artifact: web-firefox, browser: firefox, args: --surface web --project firefox }
          - { name: webkit, artifact: web-webkit, browser: webkit, args: --surface web --project webkit }
          - { name: journeys, artifact: web-journeys, browser: chromium, args: --surface journeys }
          - { name: filings, artifact: web-filings, browser: chromium, args: --surface filings }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          app: web
          browser: ${{ matrix.browser }}
      - name: run the lane on the test tier
        env:
          ARGS: ${{ matrix.args }}
        run: make test-functional FUNCTIONAL_ARGS="$ARGS"
      - if: always()
        uses: ./.github/actions/e2e-collect
        with:
          name: ${{ matrix.artifact }}

  result:
    # passes only when every lane passed and the Chromium shards together ran every required case
    needs: lane
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/download-artifact@v8
        with:
          pattern: web-chromium-*
          path: shards
      - name: require every web case across the Chromium shards
        working-directory: backend
        run: uv run python -m e2e.results ../shards/*/e2e-*/browser-results/results.json --surface web
      - env:
          RESULT: ${{ needs.lane.result }}
        run: test "$RESULT" = success
