name: e2e web
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: webkit 1, artifact: web-webkit-1, browser: webkit, args: --surface web --project webkit auth.e2e.ts shell.e2e.ts }
          - { name: webkit 2, artifact: web-webkit-2, browser: webkit, args: --surface web --project webkit auth.e2e.ts shell.e2e.ts }
          - { name: webkit 3, artifact: web-webkit-3, browser: webkit, args: --surface web --project webkit auth.e2e.ts shell.e2e.ts }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          app: web
          browser: ${{ matrix.browser }}
      - name: run the lane on the test tier
        env:
          ARGS: ${{ matrix.args }}
        run: make test-functional FUNCTIONAL_ARGS="$ARGS"
      - if: always()
        uses: ./.github/actions/e2e-collect
        with:
          name: ${{ matrix.artifact }}

