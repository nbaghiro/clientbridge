name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clientbridge
          POSTGRES_PASSWORD: clientbridge
          POSTGRES_DB: clientbridge_test_ci
        ports: ["8702:5432"]
        options: >-
          --health-cmd "pg_isready -U clientbridge" --health-interval 5s
          --health-timeout 3s --health-retries 15
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfs
          RUSTFS_SECRET_KEY: rustfs-dev-secret
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CORS_ALLOWED_ORIGINS: "*"
        ports: ["8705:9000"]
    env:
      # the service's superuser only creates roles and grants; the API and tests use clientbridge_api
      ADMIN_DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@localhost:8702/clientbridge_test_ci
      MIGRATION_DATABASE_URL: postgresql+asyncpg://clientbridge_migrator:clientbridge_migrator@localhost:8702/clientbridge_test_ci
      DATABASE_URL: postgresql+asyncpg://clientbridge_api:clientbridge_api@localhost:8702/clientbridge_test_ci
      ENV: dev
      S3_ENDPOINT: http://localhost:8705
      S3_BUCKET: clientbridge-demo-ci
      S3_ACCESS_KEY: rustfs
      S3_SECRET_KEY: rustfs-dev-secret
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
        working-directory: backend
      - run: make format-check-backend lint-backend
      - name: wait for local object storage
        working-directory: backend
        run: |
          uv run python - <<'PYTHON'
          import os
          import time
          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          storage = boto3.client(
              "s3", endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
              config=Config(connect_timeout=2, read_timeout=2, retries={"max_attempts": 0}),
          )
          for attempt in range(30):
              try:
                  storage.list_buckets()
                  break
              except (BotoCoreError, ClientError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PYTHON
      - run: make migrate
      - run: ./infra/kratos/standalone.sh  # the seed creates the demo users' Kratos identities
      - run: make seed  # tests act as the demo business's owner
      - run: make test-backend
      - run: make test-kratos  # KratosIdentityProvider against the real Kratos
      - if: failure()
        run: docker logs kratos

  contract:
    # The Stripe contract tier: the real StripeGateway against the OpenAPI mock. Marker-gated out of
    # the default suite (they need the mock service), so they run as their own job here.
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripemock/stripe-mock:latest
        ports: ["8708:12111"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
      - name: wait for stripe-mock
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8708/v1/accounts -H "Authorization: Bearer sk_test_ci" >/dev/null; then
              echo "stripe-mock ready"; exit 0
            fi
            sleep 1
          done
          echo "stripe-mock did not become ready"; exit 1
      - run: STRIPE_MOCK_URL=http://localhost:8708 uv run pytest -m contract -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: make format-check-frontend lint-frontend test-frontend
      - run: make build  # a broken Vite/tsc-b bundle must fail CI, not just tsc --noEmit

  site:
    # The marketing site's browser pass over a fresh build: links, images, layout at phone width and
    # accessibility. Its copy rules and unit tests run in the frontend job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter site exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-site

  connect:
    # Connect's client pages against the real API over a migrated, seeded Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clientbridge
          POSTGRES_PASSWORD: clientbridge
          POSTGRES_DB: clientbridge_test_ci
        ports: ["8702:5432"]
        options: >-
          --health-cmd "pg_isready -U clientbridge" --health-interval 5s
          --health-timeout 3s --health-retries 15
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfs
          RUSTFS_SECRET_KEY: rustfs-dev-secret
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CORS_ALLOWED_ORIGINS: "*"
        ports: ["8705:9000"]
    env:
      # the service's superuser only creates roles and grants; the API and tests use clientbridge_api
      ADMIN_DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@localhost:8702/clientbridge_test_ci
      MIGRATION_DATABASE_URL: postgresql+asyncpg://clientbridge_migrator:clientbridge_migrator@localhost:8702/clientbridge_test_ci
      DATABASE_URL: postgresql+asyncpg://clientbridge_api:clientbridge_api@localhost:8702/clientbridge_test_ci
      ENV: dev
      S3_ENDPOINT: http://localhost:8705
      S3_BUCKET: clientbridge-demo-ci
      S3_ACCESS_KEY: rustfs
      S3_SECRET_KEY: rustfs-dev-secret
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
        working-directory: backend
      - name: wait for local object storage
        working-directory: backend
        run: |
          uv run python - <<'PYTHON'
          import os
          import time
          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          storage = boto3.client(
              "s3", endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
              config=Config(connect_timeout=2, read_timeout=2, retries={"max_attempts": 0}),
          )
          for attempt in range(30):
              try:
                  storage.list_buckets()
                  break
              except (BotoCoreError, ClientError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PYTHON
      - run: make migrate
      - run: ./infra/kratos/standalone.sh
      - run: make seed
      - run: uv run uvicorn clientbridge.main:app --port 8701 > /tmp/api.log 2>&1 &
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter connect exec playwright install --with-deps chromium
        working-directory: frontend
      - run: until curl -sf localhost:8701/health; do sleep 1; done
        timeout-minutes: 2
      - run: make test-connect
      - if: failure()
        run: cat /tmp/api.log

  playground:
    # Every shared component's story page on a fresh playground build, on web and in both phone frames.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter playground exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-playground

  codegen-drift:
    # The generated api-client + PowerSync client schema come from the backend — fail if either is
    # stale. (run `make gen-api` / `make gen-sync-schema` and commit the result.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: make codegen-check

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sync-verification
          path: .scratchpad/sync-hardening/service-verification.log
          retention-days: 7

  web:
    # The web smoke suite against the full local stack: Postgres, PowerSync, Redis, S3, the API and the seed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter web exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make up migrate seed
      - run: uv run uvicorn clientbridge.main:app --host 127.0.0.1 --port 8701 > /tmp/api.log 2>&1 &
        working-directory: backend
      - run: until curl -sf 127.0.0.1:8701/health; do sleep 1; done
        timeout-minutes: 2
      - run: make test-web
      - if: failure()
        run: |
          cat /tmp/api.log
          docker compose logs --no-color powersync | tail -200
          docker compose logs --no-color kratos | tail -200

  mobile:
    # The Maestro walkthroughs on an Android 14 emulator, using a release build so the bundle is embedded.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # caches Gradle's dependencies and build cache, so native modules don't recompile on every run
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: uv sync
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: build the release APK
        working-directory: frontend/apps/mobile
        env:
          E2E_CLEARTEXT: "1"
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --build-cache
      - run: make up migrate seed
      - run: uv run uvicorn clientbridge.main:app --host 127.0.0.1 --port 8701 > /tmp/api.log 2>&1 &
        working-directory: backend
      - run: until curl -sf 127.0.0.1:8701/health; do sleep 1; done
        timeout-minutes: 2
      - run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - uses: actions/cache@v4
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis
      - name: create the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot saved"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb reverse tcp:8701 tcp:8701
            adb reverse tcp:8704 tcp:8704
            adb reverse tcp:8713 tcp:8713
            adb install frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            cd frontend/apps/mobile && timeout 40m "$HOME/.maestro/bin/maestro" test e2e --test-output-dir test-results
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: mobile-walkthroughs
          path: frontend/apps/mobile/test-results
          retention-days: 7
      - if: failure()
        run: cat /tmp/api.log
