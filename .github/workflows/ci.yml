name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref; a new push cancels a PR's in-flight run, while every main commit finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs pin ubuntu-24.04 so that ubuntu-latest moving to Ubuntu 26.04 (from 2026-10-19) is an explicit upgrade.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54 # the docker-compose.yml pin
        env:
          POSTGRES_USER: clientbridge
          POSTGRES_PASSWORD: clientbridge
          POSTGRES_DB: clientbridge_test_ci
        ports: ["8702:5432"]
        options: >-
          --health-cmd "pg_isready -U clientbridge" --health-interval 5s
          --health-timeout 3s --health-retries 15
      redis:
        image: redis@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports: ["8703:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 15
      rustfs:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: rustfs
          RUSTFS_SECRET_KEY: rustfs-dev-secret
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CORS_ALLOWED_ORIGINS: "*"
        ports: ["8705:9000"]
    env:
      # the service's superuser only creates roles and grants; the API and tests use clientbridge_api
      ADMIN_DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@localhost:8702/clientbridge_test_ci
      MIGRATION_DATABASE_URL: postgresql+asyncpg://clientbridge_migrator:clientbridge_migrator@localhost:8702/clientbridge_test_ci
      DATABASE_URL: postgresql+asyncpg://clientbridge_api:clientbridge_api@localhost:8702/clientbridge_test_ci
      ENV: dev
      S3_ENDPOINT: http://localhost:8705
      S3_BUCKET: clientbridge-demo-ci
      S3_ACCESS_KEY: rustfs
      S3_SECRET_KEY: rustfs-dev-secret
      S3_REGION: us-east-1
      SMTP_URL: "" # no Mailpit in this job, so mail goes to the console sender
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
        working-directory: backend
      - run: make format-check-backend lint-backend
      - name: wait for local object storage
        working-directory: backend
        run: |
          uv run python - <<'PYTHON'
          import os
          import time
          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          storage = boto3.client(
              "s3", endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
              config=Config(connect_timeout=2, read_timeout=2, retries={"max_attempts": 0}),
          )
          for attempt in range(30):
              try:
                  storage.list_buckets()
                  break
              except (BotoCoreError, ClientError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PYTHON
      - run: make migrate
      - run: make auth-standalone # the seed creates the demo users' auth identities
      - run: make test-backend
      - run: make test-auth # KratosIdentityProvider against the real auth service
      - if: failure()
        run: docker logs auth

  infra:
    # The Pulumi program, built for the cloud, staging and prod stacks against Pulumi's mocks.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
        working-directory: infra/pulumi
      - run: make format-check-infra lint-infra test-infra

  contract:
    # The Stripe contract tier: the real StripeGateway against the OpenAPI mock. Marker-gated out of
    # the default suite (they need the mock service), so they run as their own job here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      stripe-mock:
        image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78 # v0.206.0
        ports: ["8708:12111"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      - name: wait for stripe-mock
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8708/v1/accounts -H "Authorization: Bearer sk_test_ci" >/dev/null; then
              echo "stripe-mock ready"; exit 0
            fi
            sleep 1
          done
          echo "stripe-mock did not become ready"; exit 1
      - run: uv run pytest -m contract -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: make format-check-frontend lint-frontend test-frontend

  build:
    # A broken Vite or tsc -b bundle must fail CI, not just tsc --noEmit; runs beside the frontend job.
    # The site job builds the marketing site, so this job leaves it out.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: make build-apps

  images:
    # Builds the backend and web prod images without pushing, so a broken Dockerfile fails CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: backend
            server: python --version
          - image: frontend
            server: caddy version
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          target: prod
          push: false
          load: true
          tags: clientbridge-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # the pods drop every capability and forbid escalation, which refuses binaries carrying file capabilities
      - name: start the server binary as the cluster runs it
        env:
          IMAGE: clientbridge-${{ matrix.image }}:ci
          SERVER: ${{ matrix.server }}
        run: docker run --rm --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/sh "$IMAGE" -c "$SERVER"

  site:
    # The marketing site's browser pass over a fresh build: links, images, layout at phone width and
    # accessibility. Its copy rules and unit tests run in the frontend job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter site exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-site

  connect-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [default, pseudo]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter connect exec playwright install --with-deps chromium
        working-directory: frontend
      - name: run isolated functional browsers
        run: make test-functional FUNCTIONAL_ARGS="--surface connect --project ${{ matrix.project }}"
      - name: reap run-owned services after interruption
        if: always()
        working-directory: backend
        run: |
          for config in ../.scratchpad/e2e-*/compose.json; do
            [ -f "$config" ] || continue
            project="$(basename "$(dirname "$config")")"
            uv run python -m scripts.e2e_stack --cleanup "$project"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connect-e2e-${{ matrix.project }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .scratchpad/e2e-*/run.json
            .scratchpad/e2e-*/browser-results
            .scratchpad/e2e-*/browser-report
            .scratchpad/e2e-*/browser.log
            .scratchpad/e2e-*/setup.log
            .scratchpad/e2e-*/api.log
            .scratchpad/e2e-*/worker.log
            .scratchpad/e2e-*/services.log
          retention-days: 7

  codegen-drift:
    # The generated api-client + PowerSync client schema come from the backend — fail if either is
    # stale. (run `make gen-api` / `make gen-sync-schema` and commit the result.)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: make codegen-check

  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-sync
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sync-verification
          path: .scratchpad/sync-hardening/service-verification.log
          retention-days: 7

  web-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [default, pseudo]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter web exec playwright install --with-deps chromium
        working-directory: frontend
      - name: run isolated functional browsers
        run: make test-functional FUNCTIONAL_ARGS="--surface web --project ${{ matrix.project }}"
      - name: reap run-owned services after interruption
        if: always()
        working-directory: backend
        run: |
          for config in ../.scratchpad/e2e-*/compose.json; do
            [ -f "$config" ] || continue
            project="$(basename "$(dirname "$config")")"
            uv run python -m scripts.e2e_stack --cleanup "$project"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-e2e-${{ matrix.project }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .scratchpad/e2e-*/run.json
            .scratchpad/e2e-*/browser-results
            .scratchpad/e2e-*/browser-report
            .scratchpad/e2e-*/browser.log
            .scratchpad/e2e-*/setup.log
            .scratchpad/e2e-*/api.log
            .scratchpad/e2e-*/worker.log
            .scratchpad/e2e-*/services.log
          retention-days: 7

  journeys-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter web exec playwright install --with-deps chromium
        working-directory: frontend
      - name: run isolated functional browsers
        run: make test-functional FUNCTIONAL_ARGS="--surface journeys"
      - name: reap run-owned services after interruption
        if: always()
        working-directory: backend
        run: |
          for config in ../.scratchpad/e2e-*/compose.json; do
            [ -f "$config" ] || continue
            project="$(basename "$(dirname "$config")")"
            uv run python -m scripts.e2e_stack --cleanup "$project"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journeys-e2e
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .scratchpad/e2e-*/run.json
            .scratchpad/e2e-*/browser-results
            .scratchpad/e2e-*/browser-report
            .scratchpad/e2e-*/browser.log
            .scratchpad/e2e-*/setup.log
            .scratchpad/e2e-*/api.log
            .scratchpad/e2e-*/worker.log
            .scratchpad/e2e-*/services.log
          retention-days: 7

  filings-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter web exec playwright install --with-deps chromium
        working-directory: frontend
      - name: run isolated functional browsers
        run: make test-functional FUNCTIONAL_ARGS="--surface filings"
      - name: reap run-owned services after interruption
        if: always()
        working-directory: backend
        run: |
          for config in ../.scratchpad/e2e-*/compose.json; do
            [ -f "$config" ] || continue
            project="$(basename "$(dirname "$config")")"
            uv run python -m scripts.e2e_stack --cleanup "$project"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: filings-e2e
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .scratchpad/e2e-*/run.json
            .scratchpad/e2e-*/browser-results
            .scratchpad/e2e-*/browser-report
            .scratchpad/e2e-*/browser.log
            .scratchpad/e2e-*/setup.log
            .scratchpad/e2e-*/api.log
            .scratchpad/e2e-*/worker.log
            .scratchpad/e2e-*/services.log
          retention-days: 7

  shards:
    # Fails when a walkthrough is in no shard or in two, and hands the shard list to mobile-shard.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - name: check every walkthrough is in exactly one shard
        id: shards
        working-directory: frontend/apps/mobile/e2e
        run: |
          listed=$(jq -r '.[].flows[]' shards.json | sort)
          present=$(ls *.yaml | sort)
          if [ "$listed" != "$present" ] || [ -n "$(echo "$listed" | uniq -d)" ]; then
            diff <(echo "$listed") <(echo "$present"); echo "update e2e/shards.json"; exit 1
          fi
          echo "shards=$(jq -c . shards.json)" >> "$GITHUB_OUTPUT"

  mobile-build:
    # An x86_64 release APK for the emulator; when the native fingerprint is cached only the JS bundle is rebuilt.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # the e2e build the native lane installs: scripts/e2e_stack.py's native_urls("android")
    env:
      E2E_CLEARTEXT: "1"
      APP_ID: ca.clientbridge.app.e2e
      APP_NAME: Clientbridge E2E
      # the emulator's own address for the host, so a dropped adb connection cannot cut the app off
      API_URL: http://10.0.2.2:8761
      POWERSYNC_URL: http://10.0.2.2:8764
      AUTH_URL: http://10.0.2.2:8763
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: key the native build
        id: native
        working-directory: frontend/apps/mobile
        run: |
          hash=$(node ../../node_modules/@expo/fingerprint/bin/cli.js fingerprint:generate --platform android \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')
          echo "key=apk-x86_64-$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cached
        with:
          path: native-apk
          key: ${{ steps.native.outputs.key }}
      - name: rebundle the cached build
        id: rebundle
        if: steps.cached.outputs.cache-hit == 'true'
        continue-on-error: true
        run: frontend/apps/mobile/scripts/rebundle-apk.sh native-apk/app-release.apk app-release.apk
      - uses: actions/setup-java@v6
        if: steps.rebundle.outcome != 'success'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        if: steps.rebundle.outcome != 'success'
        with:
          cache-cleanup: on-success
      - name: build the release APK
        if: steps.rebundle.outcome != 'success'
        working-directory: frontend/apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install
          # the template's 512 MB Metaspace runs out compiling the app's Kotlin, which inherits it
          jvm="-Xmx4g -XX:MaxMetaspaceSize=1g"
          sed -i "s/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=$jvm/" android/gradle.properties
          grep -qx "org.gradle.jvmargs=$jvm" android/gradle.properties
          echo "kotlin.daemon.jvmargs=$jvm" >> android/gradle.properties
          cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=x86_64
          mkdir -p "$GITHUB_WORKSPACE/native-apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/native-apk/"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"
      - uses: actions/cache/save@v6
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: native-apk
          key: ${{ steps.native.outputs.key }}
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-apk
          path: app-release.apk
          retention-days: 3

  mobile-shard:
    # The Maestro walkthroughs on Android 14 emulators through the native lane, split into shards of about equal length.
    needs: [shards, mobile-build]
    name: mobile (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
        working-directory: backend
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: mobile-apk
      - name: put the build where the lane installs it from
        run: mkdir -p .scratchpad/native && mv app-release.apk .scratchpad/native/clientbridge-e2e.apk
      - name: clear the runner's own emulator
        id: emulator
        run: |
          rm -rf /usr/local/lib/android/sdk/emulator
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "key=$(frontend/apps/mobile/scripts/ci-emulator.sh key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: android
        with:
          # the pinned emulator build, the system image and the AVD with its quick-boot snapshot
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            ~/.android/avd
            ~/.android/adbkey*
          key: ${{ steps.emulator.outputs.key }}
      - name: install the emulator and save its snapshot
        if: steps.android.outputs.cache-hit != 'true'
        run: frontend/apps/mobile/scripts/ci-emulator.sh install
      # saved before the walkthroughs, so it holds the clean snapshot; only main writes it, to keep within 10 GB
      - uses: actions/cache/save@v6
        if: steps.android.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            ~/.android/avd
            ~/.android/adbkey*
          key: ${{ steps.emulator.outputs.key }}
      - name: run the walkthroughs
        run: |
          frontend/apps/mobile/scripts/ci-emulator.sh start
          make test-functional FUNCTIONAL_ARGS="--surface native --platform android --device emulator-5554 ${{ join(matrix.shard.flows, ' ') }}"
      - name: flag walkthroughs over three times their usual time
        if: success() || failure()
        run: frontend/apps/mobile/scripts/slow-flows.sh .scratchpad/e2e-*/native.log
      - name: reap run-owned services after interruption
        if: always()
        working-directory: backend
        run: |
          for config in ../.scratchpad/e2e-*/compose.json; do
            [ -f "$config" ] || continue
            project="$(basename "$(dirname "$config")")"
            uv run python -m scripts.e2e_stack --cleanup "$project"
          done
      - name: collect the device log
        if: always()
        run: adb logcat -d -v threadtime > .scratchpad/logcat.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-walkthroughs-${{ matrix.shard.id }}
          include-hidden-files: true
          path: |
            .scratchpad/logcat.txt
            /tmp/emulator.log
            .scratchpad/e2e-*/run.json
            .scratchpad/e2e-*/native-*
            .scratchpad/e2e-*/native.log
            .scratchpad/e2e-*/control.log
            .scratchpad/e2e-*/setup.log
            .scratchpad/e2e-*/api.log
            .scratchpad/e2e-*/worker.log
            .scratchpad/e2e-*/services.log
          retention-days: 3
      - if: failure()
        run: |
          tail -200 /tmp/emulator.log || true
          tail -200 .scratchpad/e2e-*/native-debug/maestro.log || true
          tail -300 .scratchpad/logcat.txt || true
          tail -200 .scratchpad/e2e-*/api.log || true

  mobile:
    # The required check: passes when the build and every shard passed.
    needs: [shards, mobile-build, mobile-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [web-functional, journeys-functional, filings-functional]
    if: always()
    steps:
      - name: require every functional project
        env:
          WEB_RESULT: ${{ needs.web-functional.result }}
          JOURNEYS_RESULT: ${{ needs.journeys-functional.result }}
          FILINGS_RESULT: ${{ needs.filings-functional.result }}
        run: |
          test "$WEB_RESULT" = success
          test "$JOURNEYS_RESULT" = success
          test "$FILINGS_RESULT" = success

  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: connect-functional
    if: always()
    steps:
      - name: require every functional project
        env:
          RESULT: ${{ needs.connect-functional.result }}
        run: test "$RESULT" = success
