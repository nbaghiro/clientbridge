name: ci
on:
  push:
    branches: [main]
  pull_request:
  # gh workflow run ci.yml --ref <branch> -f record=true keeps a watchable video of every e2e test
  workflow_dispatch:
    inputs:
      record:
        description: Record every e2e test as video (E2E_RECORD=1)
        type: boolean
        default: false

permissions:
  contents: read

# One run per ref; a new push cancels a PR's in-flight run, while every main commit finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  E2E_RECORD: ${{ github.event.inputs.record == 'true' && '1' || '' }}

# Every job sits at the top level so the run graph shows each one; jobs pin ubuntu-24.04 so that
# ubuntu-latest moving to Ubuntu 26.04 (from 2026-10-19) is an explicit upgrade.
jobs:
  lint-backend:
    name: lint backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          uv: backend
      - run: make format-check-backend lint-backend

  lint-frontend:
    name: lint frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          pnpm: "true"
      - run: make -j2 format-check-frontend lint-frontend

  lint-infra:
    # The Pulumi program, built for the cloud, staging and prod stacks against Pulumi's mocks.
    name: lint infra
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          uv: infra/pulumi
      - run: make format-check-infra lint-infra test-infra

  lint-codegen:
    # Fails when a generated file is stale; run its gen-* target and commit the result.
    name: lint codegen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          uv: backend
          pnpm: "true"
      - run: make codegen-check

  # the checks finish well inside the e2e lanes, so they follow lint and leave the first runners to e2e
  checks-backend:
    name: checks backend
    needs: [lint-backend, lint-frontend, lint-infra, lint-codegen]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          uv: backend
      - run: make test-tier
      # the seeded template is the same for the same migrations, seed and frozen instant, so its dump is kept
      - id: template
        run: echo "name=$(uv run python -m e2e.database template-name)" >> "$GITHUB_OUTPUT"
        working-directory: backend
      - uses: actions/cache@v6
        with:
          path: ~/.cache/clientbridge-test/templates
          key: ${{ steps.template.outputs.name }}
      - run: make test-backend
      - run: make test-auth # KratosIdentityProvider against the tier's auth service
      - if: failure()
        run: make test-tier-logs

  checks-contract:
    # The real StripeGateway against the tier's OpenAPI mock; marker-gated out of the default suite.
    name: checks contract
    needs: [lint-backend, lint-frontend, lint-infra, lint-codegen]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          uv: backend
      - run: make test-tier
      - run: make test-contract
      - if: failure()
        run: make test-tier-logs

  checks-frontend:
    # a broken Vite or tsc -b build passes tsc --noEmit; build-apps leaves out the site, which checks-site builds
    name: checks frontend
    needs: [lint-backend, lint-frontend, lint-infra, lint-codegen]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          pnpm: "true"
      - run: make test-frontend build-apps

  checks-images:
    # Builds the backend and web prod images without pushing, so a broken Dockerfile fails CI.
    name: checks images (${{ matrix.image }})
    needs: [lint-backend, lint-frontend, lint-infra, lint-codegen]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: backend
            server: python --version
          - image: frontend
            server: caddy version
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          target: prod
          push: false
          load: true
          tags: clientbridge-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # the pods drop every capability and forbid escalation, which refuses binaries carrying file capabilities
      - name: start the server binary as the cluster runs it
        env:
          IMAGE: clientbridge-${{ matrix.image }}:ci
          SERVER: ${{ matrix.server }}
        run: docker run --rm --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/sh "$IMAGE" -c "$SERVER"

  checks-site:
    # The marketing site's browser pass over a fresh build; its copy rules run in lint frontend.
    name: checks site
    needs: [lint-backend, lint-frontend, lint-infra, lint-codegen]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          pnpm: "true"
      - uses: ./.github/actions/playwright
        with:
          app: site
      - run: make test-site

  # the e2e jobs start at once, beside lint: their lanes are the longest, so waiting on lint only delays the result
  prepare:
    # Seeds the core demo businesses once and builds web, Connect and admin once, for the browser lanes
    # to restore and preview instead of each doing both.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
      - run: make test-prepare
      - id: tier
        run: echo "dir=$HOME/.cache/clientbridge-test" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-prepared
          if-no-files-found: error
          path: |
            ${{ steps.tier.outputs.dir }}/snapshots/*.dump
            ${{ steps.tier.outputs.dir }}/snapshots/*.json
            ${{ steps.tier.outputs.dir }}/builds
          retention-days: 1

  web:
    name: web ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.inputs.record == 'true' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the runner splits a sharded lane's cases by their measured seconds (backend/e2e/seconds.json)
          - {
              name: chromium (1/5),
              artifact: web-chromium-1,
              browser: chromium,
              args: --surface web --shard 1/5,
            }
          - {
              name: chromium (2/5),
              artifact: web-chromium-2,
              browser: chromium,
              args: --surface web --shard 2/5,
            }
          - {
              name: chromium (3/5),
              artifact: web-chromium-3,
              browser: chromium,
              args: --surface web --shard 3/5,
            }
          - {
              name: chromium (4/5),
              artifact: web-chromium-4,
              browser: chromium,
              args: --surface web --shard 4/5,
            }
          - {
              name: chromium (5/5),
              artifact: web-chromium-5,
              browser: chromium,
              args: --surface web --shard 5/5,
            }
          - {
              name: journeys (1/2),
              artifact: web-journeys-1,
              browser: chromium,
              args: --surface journeys --shard 1/2,
            }
          - {
              name: journeys (2/2),
              artifact: web-journeys-2,
              browser: chromium,
              args: --surface journeys --shard 2/2,
            }
          # the short lanes share a job, one after the other, since each runs in about a job's setup time
          - {
              name: pseudo-locale and filings,
              artifact: web-pseudo,
              browser: chromium,
              args: "--surface web --project pseudo;--surface filings",
            }
          # Firefox and WebKit run only the cases tagged @browsers; CI keeps them on Linux
          - {
              name: firefox and webkit,
              artifact: web-browsers,
              browser: firefox,
              also: webkit,
              args: "--surface web --project firefox;--surface web --project webkit",
            }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          app: web
          browser: ${{ matrix.browser }}
          prepared: "true"
      - if: matrix.also
        uses: ./.github/actions/playwright
        with:
          app: web
          browser: ${{ matrix.also }}
      - name: run the lane on the test tier
        env:
          ARGS: ${{ matrix.args }}
        run: |
          status=0
          IFS=';' read -ra runs <<< "$ARGS"
          for run in "${runs[@]}"; do
            make test-functional FUNCTIONAL_ARGS="$run" || status=$?
          done
          exit "$status"
      - if: always()
        uses: ./.github/actions/e2e-collect
        with:
          name: ${{ matrix.artifact }}

  web-result:
    # passes only when every web lane passed and each sharded lane's shards together ran its required cases
    name: web result
    needs: web
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/download-artifact@v8
        with:
          pattern: web-chromium-*
          path: chromium
      - uses: actions/download-artifact@v8
        with:
          pattern: web-journeys-*
          path: journeys
      - name: require every web case across the Chromium shards
        working-directory: backend
        run: |
          uv run python -m e2e.results ../chromium/*/e2e-*/browser-results/results.json --surface web \
            --seconds ../chromium-seconds.json
      - name: require every journey across the journeys shards
        if: success() || failure()
        working-directory: backend
        run: |
          uv run python -m e2e.results ../journeys/*/e2e-*/browser-results/results.json --surface journeys \
            --seconds ../journeys-seconds.json
      # each case's measured seconds, merged into backend/e2e/seconds.json under web to rebalance the shards
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-case-seconds
          if-no-files-found: ignore
          path: |
            chromium-seconds.json
            journeys-seconds.json
          retention-days: 7
      - env:
          RESULT: ${{ needs.web.result }}
        run: test "$RESULT" = success

  connect:
    name: connect ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.inputs.record == 'true' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # two projects to a job, one after the other: each runs in about two minutes, under a job's setup
        include:
          - {
              name: chromium and pseudo-locale,
              artifact: connect-chromium,
              browser: chromium,
              projects: default pseudo,
            }
          # Firefox and WebKit run only the cases tagged @browsers; CI keeps them on Linux
          - {
              name: firefox and webkit,
              artifact: connect-browsers,
              browser: firefox,
              also: webkit,
              projects: firefox webkit,
            }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          app: connect
          browser: ${{ matrix.browser }}
          prepared: "true"
      - if: matrix.also
        uses: ./.github/actions/playwright
        with:
          app: connect
          browser: ${{ matrix.also }}
      - name: run the lane's projects on the test tier
        env:
          PROJECTS: ${{ matrix.projects }}
        run: |
          status=0
          for project in $PROJECTS; do
            make test-functional FUNCTIONAL_ARGS="--surface connect --project $project" || status=$?
          done
          exit "$status"
      - if: always()
        uses: ./.github/actions/e2e-collect
        with:
          name: ${{ matrix.artifact }}

  android-build:
    # An x86_64 release APK for the emulator; when the native fingerprint is cached only the JS bundle is rebuilt.
    name: android build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_CLEARTEXT: "1"
      APP_NAME: Clientbridge E2E
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
        working-directory: backend
      # the app id and the emulator's host addresses the native lane forwards, from the lane itself
      - name: point the build at the native lane
        working-directory: backend
        run: |
          uv run python -c 'from e2e.native import native_urls
          for name, value in native_urls("android").items(): print(f"{name}={value}")' >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: key the native build
        id: native
        working-directory: frontend/apps/mobile
        run: |
          hash=$(node ../../node_modules/@expo/fingerprint/bin/cli.js fingerprint:generate --platform android \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')
          echo "key=apk-x86_64-$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cached
        with:
          path: native-apk
          key: ${{ steps.native.outputs.key }}
      - name: rebundle the cached build
        id: rebundle
        if: steps.cached.outputs.cache-hit == 'true'
        continue-on-error: true
        run: frontend/apps/mobile/scripts/rebundle-apk.sh native-apk/app-release.apk app-release.apk
      - uses: actions/setup-java@v6
        if: steps.rebundle.outcome != 'success'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        if: steps.rebundle.outcome != 'success'
        with:
          cache-cleanup: on-success
      - name: build the release APK
        if: steps.rebundle.outcome != 'success'
        working-directory: frontend/apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install
          # the template's 512 MB Metaspace runs out compiling the app's Kotlin, which inherits it
          jvm="-Xmx4g -XX:MaxMetaspaceSize=1g"
          sed -i "s/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=$jvm/" android/gradle.properties
          grep -qx "org.gradle.jvmargs=$jvm" android/gradle.properties
          echo "kotlin.daemon.jvmargs=$jvm" >> android/gradle.properties
          cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=x86_64
          mkdir -p "$GITHUB_WORKSPACE/native-apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/native-apk/"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"
      - uses: actions/cache/save@v6
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: native-apk
          key: ${{ steps.native.outputs.key }}
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-apk
          path: app-release.apk
          retention-days: 3

  android:
    # The Maestro walkthroughs on Android 14 emulators, in shards of equal measured length, set up beside the build.
    name: android (${{ matrix.shard }}/7)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # to see when the build and the prepare job's snapshot are uploaded
      actions: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
        working-directory: backend
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: clear the runner's own emulator
        id: emulator
        run: |
          rm -rf /usr/local/lib/android/sdk/emulator
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "key=$(frontend/apps/mobile/scripts/ci-emulator.sh key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: android
        with:
          # the pinned emulator build, the system image and the AVD with its quick-boot snapshot
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            ~/.android/avd
            ~/.android/adbkey*
          key: ${{ steps.emulator.outputs.key }}
      - name: install the emulator and save its snapshot
        if: steps.android.outputs.cache-hit != 'true'
        run: frontend/apps/mobile/scripts/ci-emulator.sh install
      # saved before the walkthroughs, so it holds the clean snapshot; only main writes it, to keep within 10 GB
      - uses: actions/cache/save@v6
        if: steps.android.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            ~/.android/avd
            ~/.android/adbkey*
          key: ${{ steps.emulator.outputs.key }}
      - run: make test-tier
      - name: start the emulator
        run: frontend/apps/mobile/scripts/ci-emulator.sh start
      # a cold native build takes the build job's whole timeout
      - uses: ./.github/actions/await-job
        with:
          job: android build
          minutes: "40"
      - uses: actions/download-artifact@v8
        with:
          name: mobile-apk
      - name: put the build where the lane installs it from
        run: mkdir -p .scratchpad/native && mv app-release.apk .scratchpad/native/clientbridge-e2e.apk
      # prepare runs beside the build, so its seed snapshot is normally uploaded by now; without it the lane seeds its own
      - name: wait for the prepared seed snapshot
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=e2e-prepared" --jq .total_count)
            if [ "$found" = 1 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          echo "::warning::no prepared seed snapshot after five minutes; the lane seeds its own"
      - if: steps.prepared.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-prepared
          path: ${{ runner.temp }}/prepared
      - if: steps.prepared.outputs.found == 'true'
        run: mkdir -p ~/.cache/clientbridge-test && cp -R "$RUNNER_TEMP/prepared/snapshots" ~/.cache/clientbridge-test/
      - name: run the walkthroughs
        working-directory: backend
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          shard=$(uv run python -m e2e.shards --surface native --count 7 --shard "$SHARD")
          flows=$(jq -r '.flows | join(" ")' <<< "$shard")
          faked=$(jq -r '.faked | join(" ")' <<< "$shard")
          echo "flows: $flows${faked:+, with the stand-in Stripe: $faked}"
          status=0
          make -C .. test-mobile PLATFORM=android DEVICE=emulator-5554 ARGS="$flows" || status=$?
          if [ -n "$faked" ]; then
            make -C .. test-mobile PLATFORM=android DEVICE=emulator-5554 ARGS="--fake-stripe $faked" || status=$?
          fi
          exit "$status"
      - name: flag walkthroughs over three times their usual time
        if: success() || failure()
        run: frontend/apps/mobile/scripts/slow-flows.sh .scratchpad/e2e-*/native.log
      - name: collect the device and test tier logs
        if: always()
        run: |
          adb logcat -d -v threadtime > .scratchpad/logcat.txt || true
          make test-tier-logs > .scratchpad/tier.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-walkthroughs-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .scratchpad/logcat.txt
            /tmp/emulator.log
            .scratchpad/e2e-*/run.json
            .scratchpad/e2e-*/native-*
            .scratchpad/e2e-*/native.log
            .scratchpad/e2e-*/recordings
            .scratchpad/e2e-*/control.log
            .scratchpad/e2e-*/setup.log
            .scratchpad/e2e-*/api.log
            .scratchpad/e2e-*/worker.log
            .scratchpad/e2e-*/purge.json
            .scratchpad/tier.log
          retention-days: 3
      - if: failure()
        run: |
          tail -200 /tmp/emulator.log || true
          tail -200 .scratchpad/e2e-*/native-debug/maestro.log || true
          tail -300 .scratchpad/logcat.txt || true
          tail -200 .scratchpad/e2e-*/api.log || true

  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          app: "@clientbridge/sync"
      # the lifecycle cases also run in Firefox and WebKit
      - uses: ./.github/actions/playwright
        with:
          app: "@clientbridge/sync"
          browser: firefox
      - uses: ./.github/actions/playwright
        with:
          app: "@clientbridge/sync"
          browser: webkit
      - run: make test-sync
      - name: collect the test tier's logs
        if: always()
        run: mkdir -p .scratchpad && make test-tier-logs > .scratchpad/tier.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sync-verification
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .scratchpad/sync-*
            .scratchpad/tier.log
          retention-days: 7

  ci-result:
    # the one required check, so the ruleset doesn't list each job; real Stripe reports in e2e-stripe.yml
    needs:
      - lint-backend
      - lint-frontend
      - lint-infra
      - lint-codegen
      - checks-backend
      - checks-contract
      - checks-frontend
      - checks-images
      - checks-site
      - prepare
      - web
      - web-result
      - connect
      - android-build
      - android
      - sync
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # to list this run's jobs for the summary
      actions: read
    timeout-minutes: 2
    steps:
      - name: write each job's wait, run time and finish to the run summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          start=$(gh api "$run" --jq .run_started_at)
          gh api "$run/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" | jq -r --arg start "$start" '
            def mins(from; to): ((to | fromdateiso8601) - (from | fromdateiso8601)) / 6 | round / 10;
            [.jobs[] | select(.completed_at != null)] | sort_by(.completed_at) as $jobs
            | "### Jobs by finish, in minutes from the run start",
              "",
              "| Job | Result | Waited for a runner | Ran | Finished at |",
              "| --- | --- | ---: | ---: | ---: |",
              ($jobs[] | "| \(.name) | \(.conclusion) | \(mins(.created_at; .started_at)) | \(mins(.started_at; .completed_at)) | \(mins($start; .completed_at)) |")
          ' >> "$GITHUB_STEP_SUMMARY"
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
