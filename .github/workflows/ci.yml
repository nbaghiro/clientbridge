name: ci
on:
  push:
    branches: [main]
  pull_request:
  # gh workflow run ci.yml --ref <branch> -f record=true keeps a watchable video of every e2e test
  workflow_dispatch:
    inputs:
      record:
        description: Record every e2e test as video (E2E_RECORD=1)
        type: boolean
        default: false

permissions:
  contents: read

# One run per ref; a new push cancels a PR's in-flight run, while every main commit finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs pin ubuntu-24.04 so that ubuntu-latest moving to Ubuntu 26.04 (from 2026-10-19) is an explicit upgrade.
jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # checks finish well inside the e2e lanes, so they follow lint and leave the first runners to e2e
  checks:
    needs: lint
    uses: ./.github/workflows/checks.yml

  # e2e starts at once, beside lint: its lanes are the longest, so waiting on lint only delays the result
  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      # the Android lanes wait for the APK and the prepare job's artifact while they may still be uploading
      actions: read

  ci-result:
    # the one required check, so the ruleset doesn't list each job; real Stripe reports in e2e-stripe.yml
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
