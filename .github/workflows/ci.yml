name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clientbridge
          POSTGRES_PASSWORD: clientbridge
          POSTGRES_DB: clientbridge
        ports: ["8702:5432"]
        options: >-
          --health-cmd "pg_isready -U clientbridge" --health-interval 5s
          --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@localhost:8702/clientbridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
        working-directory: backend
      - run: make format-check-backend lint-backend
      - run: make migrate seed  # tests act as the demo business's owner
      - run: make test-backend

  contract:
    # The Stripe contract tier: the real StripeGateway against the OpenAPI mock. Marker-gated out of
    # the default suite (they need the mock service), so they run as their own job here.
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripemock/stripe-mock:latest
        ports: ["8708:12111"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
      - name: wait for stripe-mock
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8708/v1/accounts -H "Authorization: Bearer sk_test_ci" >/dev/null; then
              echo "stripe-mock ready"; exit 0
            fi
            sleep 1
          done
          echo "stripe-mock did not become ready"; exit 1
      - run: STRIPE_MOCK_URL=http://localhost:8708 uv run pytest -m contract -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: make format-check-frontend lint-frontend test-frontend
      - run: make build  # a broken Vite/tsc-b bundle must fail CI, not just tsc --noEmit

  site:
    # The marketing site's browser pass over a fresh build: links, images, layout at phone width and
    # accessibility. Its copy rules and unit tests run in the frontend job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter site exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-site

  connect:
    # Connect's client pages against the real API over a migrated, seeded Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clientbridge
          POSTGRES_PASSWORD: clientbridge
          POSTGRES_DB: clientbridge
        ports: ["8702:5432"]
        options: >-
          --health-cmd "pg_isready -U clientbridge" --health-interval 5s
          --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@localhost:8702/clientbridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
        working-directory: backend
      - run: make migrate seed
      - run: uv run uvicorn clientbridge.main:app --port 8701 > /tmp/api.log 2>&1 &
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter connect exec playwright install --with-deps chromium
        working-directory: frontend
      - run: until curl -sf localhost:8701/health; do sleep 1; done
        timeout-minutes: 2
      - run: make test-connect
      - if: failure()
        run: cat /tmp/api.log

  playground:
    # Every shared component's story page on a fresh playground build, on web and in both phone frames.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter playground exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-playground

  codegen-drift:
    # The generated api-client + PowerSync client schema come from the backend — fail if either is
    # stale. (run `make gen-api` / `make gen-sync-schema` and commit the result.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: make codegen-check
