name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref; a new push cancels a PR's in-flight run, while every main commit finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs pin ubuntu-24.04 so that ubuntu-latest moving to Ubuntu 26.04 (from 2026-10-19) is an explicit upgrade.
jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  checks:
    needs: lint
    uses: ./.github/workflows/checks.yml

  e2e:
    needs: lint
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      # the Android lanes look up the prepare job's artifact while it may still be uploading
      actions: read

  ci-result:
    # the one required check, so the ruleset doesn't list each job
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
