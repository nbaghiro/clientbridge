name: e2e connect
on:
  workflow_call:

permissions:
  contents: read

# a manual ci run with record keeps a video of every test; reusable workflows see the caller's event
env:
  E2E_RECORD: ${{ github.event.inputs.record == 'true' && '1' || '' }}

jobs:
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.inputs.record == 'true' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # two projects to a job, one after the other: each runs in about two minutes, under a job's setup
        include:
          - { name: chromium and pseudo-locale, artifact: connect-chromium, browser: chromium, projects: default pseudo }
          # Firefox and WebKit run only the cases tagged @browsers; CI keeps them on Linux
          - { name: firefox and webkit, artifact: connect-browsers, browser: firefox, also: webkit, projects: firefox webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-setup
        with:
          app: connect
          browser: ${{ matrix.browser }}
          prepared: "true"
      - if: matrix.also
        uses: ./.github/actions/playwright
        with:
          app: connect
          browser: ${{ matrix.also }}
      - name: run the lane's projects on the test tier
        env:
          PROJECTS: ${{ matrix.projects }}
        run: |
          status=0
          for project in $PROJECTS; do
            make test-functional FUNCTIONAL_ARGS="--surface connect --project $project" || status=$?
          done
          exit "$status"
      - if: always()
        uses: ./.github/actions/e2e-collect
        with:
          name: ${{ matrix.artifact }}
