name: stripe-qa
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stripe-qa-merchants
  cancel-in-progress: false
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    environment: stripe-sandbox
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54  # the docker-compose.yml pin
        env:
          POSTGRES_USER: clientbridge
          POSTGRES_PASSWORD: clientbridge
          POSTGRES_DB: clientbridge_test_ci
        ports: ["8702:5432"]
        options: >-
          --health-cmd "pg_isready -U clientbridge" --health-interval 5s
          --health-timeout 3s --health-retries 15
      redis:
        image: redis@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports: ["8703:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 15
      rustfs:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: rustfs
          RUSTFS_SECRET_KEY: rustfs-dev-secret
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CORS_ALLOWED_ORIGINS: "*"
        ports: ["8705:9000"]
    env:
      # the service's superuser only creates roles and grants; the API and tests use clientbridge_api
      ADMIN_DATABASE_URL: postgresql+asyncpg://clientbridge:clientbridge@localhost:8702/clientbridge_test_ci
      MIGRATION_DATABASE_URL: postgresql+asyncpg://clientbridge_migrator:clientbridge_migrator@localhost:8702/clientbridge_test_ci
      DATABASE_URL: postgresql+asyncpg://clientbridge_api:clientbridge_api@localhost:8702/clientbridge_test_ci
      ENV: dev
      S3_ENDPOINT: http://localhost:8705
      S3_BUCKET: clientbridge-demo-ci
      S3_ACCESS_KEY: rustfs
      S3_SECRET_KEY: rustfs-dev-secret
      S3_REGION: us-east-1
      SMTP_URL: ""
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PLATFORM: ${{ vars.STRIPE_TEST_PLATFORM }}
      STRIPE_TEST_CONNECTED_ACCOUNT: ${{ vars.STRIPE_TEST_CONNECTED_ACCOUNT }}
      STRIPE_TEST_OTHER_ACCOUNT: ${{ vars.STRIPE_TEST_OTHER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
        working-directory: backend
      - name: install verified Stripe CLI
        run: |
          curl --fail --silent --show-error --location https://github.com/stripe/stripe-cli/releases/download/v1.53.1/stripe_1.53.1_linux_x86_64.tar.gz --output /tmp/stripe.tar.gz
          echo "032fe0b849a9d6a222488bc846445bafeae993af1026b78a8121d02321ca1fd1  /tmp/stripe.tar.gz" | sha256sum --check
          tar -xzf /tmp/stripe.tar.gz -C /tmp stripe
          sudo install /tmp/stripe /usr/local/bin/stripe
      - name: verify dedicated sandbox readiness
        run: make test-stripe-qa STRIPE_QA_ARGS="--preflight"
      - name: wait for local object storage
        working-directory: backend
        run: |
          uv run python - <<'PYTHON'
          import os
          import time
          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          storage = boto3.client(
              "s3", endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_SECRET_KEY"],
              region_name=os.environ["S3_REGION"],
              config=Config(connect_timeout=2, read_timeout=2, retries={"max_attempts": 0}),
          )
          for attempt in range(30):
              try:
                  storage.list_buckets()
                  break
              except (BotoCoreError, ClientError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PYTHON
      - run: make migrate
      - run: make auth-standalone  # the seed creates the demo users' auth identities
      - name: run signed-webhook payment scenarios
        run: make test-stripe-qa STRIPE_QA_ARGS="--output ../.scratchpad/stripe-qa/ci"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stripe-qa-results
          include-hidden-files: true
          path: .scratchpad/stripe-qa/ci/results.json
          retention-days: 7
          if-no-files-found: warn


  browser:
    needs: sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    environment: stripe-sandbox
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      STRIPE_TEST_PLATFORM: ${{ vars.STRIPE_TEST_PLATFORM }}
      STRIPE_TEST_CONNECTED_ACCOUNT: ${{ vars.STRIPE_TEST_CONNECTED_ACCOUNT }}
      STRIPE_TEST_OTHER_ACCOUNT: ${{ vars.STRIPE_TEST_OTHER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - run: pnpm --filter connect exec playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: install verified Stripe CLI
        run: |
          curl --fail --silent --show-error --location https://github.com/stripe/stripe-cli/releases/download/v1.53.1/stripe_1.53.1_linux_x86_64.tar.gz --output /tmp/stripe.tar.gz
          echo "032fe0b849a9d6a222488bc846445bafeae993af1026b78a8121d02321ca1fd1  /tmp/stripe.tar.gz" | sha256sum --check
          tar -xzf /tmp/stripe.tar.gz -C /tmp stripe
          sudo install /tmp/stripe /usr/local/bin/stripe
      - name: run isolated Stripe browser checkout
        run: make test-stripe-browser STRIPE_BROWSER_ARGS="--credentials environment"
      - name: recover run-owned Stripe objects after incomplete cleanup
        if: ${{ always() && env.STRIPE_TEST_SECRET_KEY != '' }}
        working-directory: backend
        run: |
          set -euo pipefail
          for state in ../.scratchpad/e2e-*/stripe-fixtures.json; do
            [ -f "$state" ] || continue
            cleanup_status="$(uv run python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("provider_cleanup", "unknown"))' "$(dirname "$state")/run.json")"
            if [ "$cleanup_status" != "passed" ]; then
              uv run python -m scripts.e2e_stripe_recover --credentials environment --state "$state" --apply
            fi
          done
      - name: reap run-owned services after interruption
        if: always()
        working-directory: backend
        run: |
          for config in ../.scratchpad/e2e-*/compose.json; do
            [ -f "$config" ] || continue
            project="$(basename "$(dirname "$config")")"
            uv run python -m scripts.e2e_stack --cleanup "$project"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stripe-browser-results
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .scratchpad/e2e-*/run.json
            .scratchpad/e2e-*/stripe-fixtures.json
            .scratchpad/e2e-*/stripe-deliveries.json
            .scratchpad/e2e-*/stripe-relay.json
            .scratchpad/e2e-*/provider-recovery.json
            .scratchpad/e2e-*/browser-results/results.json
          retention-days: 7
