name: stripe-qa
on:
  schedule:
    # 07:00 UTC, after the day's merges and before the morning
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/stripe-real.yml
    with:
      nightly: true
    secrets:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
