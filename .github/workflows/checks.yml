name: checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          uv: backend
      - run: make test-tier
      # the seeded template is the same for the same migrations, seed and frozen instant, so its dump is kept
      - id: template
        run: echo "name=$(uv run python -m e2e.database template-name)" >> "$GITHUB_OUTPUT"
        working-directory: backend
      - uses: actions/cache@v6
        with:
          path: ~/.cache/clientbridge-test/templates
          key: ${{ steps.template.outputs.name }}
      - run: make test-backend
      - run: make test-auth # KratosIdentityProvider against the tier's auth service
      - if: failure()
        run: make test-tier-logs

  contract:
    # The Stripe contract tier: the real StripeGateway against the tier's OpenAPI mock. Marker-gated
    # out of the default suite, so they run as their own job here.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          uv: backend
      - run: make test-tier
      - run: make test-contract
      - if: failure()
        run: make test-tier-logs

  frontend:
    # The bundle build is here because a broken Vite or tsc -b build passes tsc --noEmit; the site job
    # builds the marketing site, so build-apps leaves it out.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          pnpm: "true"
      - run: make test-frontend build-apps

  images:
    # Builds the backend and web prod images without pushing, so a broken Dockerfile fails CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: backend
            server: python --version
          - image: frontend
            server: caddy version
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          target: prod
          push: false
          load: true
          tags: clientbridge-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # the pods drop every capability and forbid escalation, which refuses binaries carrying file capabilities
      - name: start the server binary as the cluster runs it
        env:
          IMAGE: clientbridge-${{ matrix.image }}:ci
          SERVER: ${{ matrix.server }}
        run: docker run --rm --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/sh "$IMAGE" -c "$SERVER"

  site:
    # The marketing site's browser pass over a fresh build: links, images, layout at phone width and
    # accessibility. Its copy rules run in the lint group and its unit tests in the frontend job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          pnpm: "true"
      - uses: ./.github/actions/playwright
        with:
          app: site
      - run: make test-site
