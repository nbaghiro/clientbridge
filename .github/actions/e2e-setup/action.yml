name: e2e setup
description: >
  Installs the backend and frontend and the lane's browser, starts the test tier, and restores what
  the prepare job made: the seed snapshot and the web, Connect and admin builds.
inputs:
  app:
    description: The pnpm package whose Playwright installs the browser; empty installs none.
    default: ""
  browser:
    description: chromium, firefox or webkit.
    default: chromium
  prepared:
    description: Restore the prepare job's snapshot and builds into the tier's folder.
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.0
    - uses: pnpm/action-setup@v6
      with:
        version: 9
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - run: uv sync --frozen
      shell: bash
      working-directory: backend
    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
      working-directory: frontend
    - if: inputs.app != ''
      uses: ./.github/actions/playwright
      with:
        app: ${{ inputs.app }}
        browser: ${{ inputs.browser }}
    - run: make test-tier
      shell: bash
    - id: tier
      run: echo "dir=$HOME/.cache/clientbridge-test" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.prepared == 'true'
      uses: actions/download-artifact@v8
      with:
        name: e2e-prepared
        path: ${{ steps.tier.outputs.dir }}
