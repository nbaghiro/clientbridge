# PowerSync service config (local dev). See docs/sync.md.
replication:
  connections:
    - type: postgresql
      uri: postgresql://clientbridge:clientbridge@postgres:5432/clientbridge
      # PowerSync consumes a logical replication slot (wal_level=logical set in docker-compose).
      sslmode: disable

storage:
  type: postgresql  # store sync buckets in the same Postgres for dev (use mongodb/own DB in prod)
  uri: postgresql://clientbridge:clientbridge@postgres:5432/clientbridge

port: 8080
sync_rules:
  path: /config/sync-rules.yaml

client_auth:
  # Dev: HS256 shared secret matching backend JWT_SECRET.
  # Prod: switch to RS256 + the backend JWKS endpoint (jwks_uri).
  jwks:
    - type: hmac
      kid: clientbridge-dev
      algorithm: HS256
      secret: dev-change-me
  audience: ["powersync"]
