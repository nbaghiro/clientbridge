# PowerSync service config (local dev; staging and production read powersync.deployed.yaml).
# Prereqs (created by `make up` and `make migrate` through backend/scripts/db_access.py):
# wal_level=logical, a `powersync` publication limited to the synced tables, the replication role
# and a separate `powersync_storage` database owned by the storage role.
replication:
  connections:
    - type: postgresql
      # replication only: REPLICATION plus SELECT on the published tables
      uri: postgresql://powersync_source:powersync_source@postgres:5432/clientbridge
      sslmode: disable

# Bucket storage = a SEPARATE Postgres database on the same instance (so its tables aren't picked up
# by the source publication). sslmode is a structured field here — pgwire ignores a `?sslmode=` URI
# query param, and our dev Postgres runs with ssl=off.
storage:
  type: postgresql
  uri: postgresql://powersync_storage_owner:powersync_storage_owner@postgres:5432/powersync_storage
  sslmode: disable

port: 8080

sync_rules:
  path: /config/sync-rules.yaml

client_auth:
  # Dev: a static symmetric (HS256) key matching the backend JWT secret (k = base64url of the dev
  # secret "clientbridge-dev-secret-do-not-use-in-prod"). Deployed environments use RS256 through
  # powersync.deployed.yaml.
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: clientbridge-dev
        k: Y2xpZW50YnJpZGdlLWRldi1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9k
  audience:
    - powersync
