# PowerSync Sync Streams: the read authorization for every device replica (the stream bypasses
# Postgres RLS). Writes go through typed /v1 commands instead. See .docs/architecture.md.
# Each query lists its columns explicitly; backend/tests/fixtures/sync_projections.json is the
# reviewed copy that test_sync_projections compares against.
config:
  edition: 3
  # keep the timestamp format the clients parse today; changing it is a separate decision
  timestamps_iso8601: false

streams:

  # Every active member: the catalog, the client book, forms and contracts, files and the inbox.
  business_shared:
    auto_subscribe: true
    with:
      member: SELECT business_id FROM staff WHERE user_id = auth.user_id() AND status = 'active'
    queries:
      - SELECT created_by, name, email, phone, user_id, tags, status, custom_fields, preferred_channel, archived_at, id, business_id, created_at, updated_at, deleted_at FROM clients WHERE business_id IN member AND deleted_at IS NULL
      - SELECT client_id, name, attributes, id, business_id, created_at, updated_at, deleted_at FROM subjects WHERE business_id IN member AND deleted_at IS NULL
      - SELECT created_by, parent_type, parent_id, body, pinned, id, business_id, created_at, updated_at FROM notes WHERE business_id IN member
      - SELECT client_id, channel, status, source, recorded_by, expires_at, id, business_id, created_at, updated_at FROM consents WHERE business_id IN member
      - SELECT staff_id, basis, weekday, date, start_time, end_time, available, note, starts_at, ends_at, reason, id, business_id, created_at, updated_at FROM hours WHERE business_id IN member AND staff_id IS NULL
      - SELECT created_by, kind, name, description, variant_parent_id, variant_label, price_cents, currency, duration_min, capacity, category, color, online_bookable, sell_online, buffer_before_min, buffer_after_min, deposit_type, deposit_value, interval, frequency, session_count, validity_days, covers_item_id, visits_per_period, member_discount_bps, gift_amounts, tax_class, sku, cost_cents, track_stock, stock_on_hand, low_stock_at, active, addon, addon_for, id, business_id, created_at, updated_at FROM items WHERE business_id IN member
      - SELECT client_id, item_id, sessions_total, expires_at, status, payment_id, id, business_id, created_at, updated_at FROM packages WHERE business_id IN member
      - SELECT client_id, item_id, status, current_period_end, payment_method_id, id, business_id, created_at, updated_at FROM subscriptions WHERE business_id IN member
      - SELECT name, require_signature, active, send_on, id, business_id, created_at, updated_at FROM forms WHERE business_id IN member
      - SELECT form_id, input, name, label, help, required, options, position, id, business_id, created_at, updated_at FROM fields WHERE business_id IN member
      - SELECT name, body, version, active, id, business_id, created_at, updated_at FROM contracts WHERE business_id IN member
      - SELECT parent_type, parent_id, purpose, content_type, size, uploaded_at, id, business_id, created_at, updated_at FROM files WHERE business_id IN member
      - SELECT client_id, channel, status, id, business_id, created_at, updated_at FROM threads WHERE business_id IN member

  # Staff and contractors read the business without tax numbers or billing email, the team without pay,
  # and the pickup queue without prices. Owner/admin read the same rows from business_full, never both.
  staff_limited:
    auto_subscribe: true
    with:
      limited: SELECT business_id FROM staff WHERE user_id = auth.user_id() AND status = 'active' AND role != 'owner' AND role != 'admin'
    queries:
      - SELECT id, name, slug, timezone, province, brand, stripe_account_id, stripe_charges_enabled, tax_registered, setup_dismissed_at, plan_status, trial_ends_at, subject FROM businesses WHERE id IN limited
      - SELECT id, hours_revision, business_id, user_id, role, title, color, status, invite_email, invited_at, created_at, updated_at FROM staff WHERE business_id IN limited
      - SELECT id, name FROM users WHERE id IN (SELECT user_id FROM staff WHERE business_id IN limited)
      # The pickup queue: paid online orders (pickup_status is set only once paid) and what to pack, without prices.
      - SELECT id, business_id, number, client_id, source, pickup_status, preparing_at, ready_at, picked_up_at, paid_at, pickup_from, pickup_to, note, notify_sms, created_at, updated_at FROM orders WHERE business_id IN limited AND pickup_status IS NOT NULL
      - SELECT id, business_id, order_id, item_id, description, quantity, position, created_at, updated_at FROM lines WHERE business_id IN limited AND for_pickup = true

  # A member's own calendar, hours and earnings, keyed to their staff row.
  staff_self:
    auto_subscribe: true
    with:
      own: SELECT id FROM staff WHERE user_id = auth.user_id() AND status = 'active'
    queries:
      - SELECT booking_id, staff_id, item_id, description, quantity, unit_amount_cents, id, business_id, created_at, updated_at FROM addons WHERE staff_id IN own
      - SELECT staff_id, basis, weekday, date, start_time, end_time, available, note, starts_at, ends_at, reason, id, business_id, created_at, updated_at FROM hours WHERE staff_id IN own
      - SELECT item_id, staff_id, client_id, frequency, interval, byday, monthly_by, count, until, status, id, business_id, created_at, updated_at FROM recurrences WHERE staff_id IN own
      - SELECT owner_type, owner_id, category, code, currency, balance_cents, id, business_id, created_at, updated_at FROM accounts WHERE owner_type = 'staff' AND owner_id IN own
      - SELECT journal_id, account_id, owner_type, owner_id, amount_cents, currency, event, source_type, source_id, subject_type, subject_id, ref, leg, meta, occurred_at, available_at, created_at, id, business_id FROM entries WHERE owner_type = 'staff' AND owner_id IN own

  # Owner and admin: every member's work, the financials and the inbox.
  business_full:
    auto_subscribe: true
    with:
      managed: SELECT business_id FROM staff WHERE user_id = auth.user_id() AND status = 'active' AND role != 'staff' AND role != 'contractor'
    queries:
      - SELECT id, name, slug, timezone, province, unit, street_number, street_name, city, postal_code, legal_phone, billing_email, gst_hst_number, qst_number, pst_number, filing_frequency, google_review_url, brand, stripe_account_id, stripe_charges_enabled, tax_registered, setup_dismissed_at, plan, plan_status, trial_ends_at, subject FROM businesses WHERE id IN managed
      - SELECT id, hours_revision, business_id, user_id, role, payee, rate_type, rate_bps, rate_cents, retail_rate_bps, title, color, status, invite_email, invited_at, created_at, updated_at FROM staff WHERE business_id IN managed
      - SELECT id, name FROM users WHERE id IN (SELECT user_id FROM staff WHERE business_id IN managed)
      - SELECT booking_id, staff_id, item_id, description, quantity, unit_amount_cents, id, business_id, created_at, updated_at FROM addons WHERE business_id IN managed
      - SELECT staff_id, basis, weekday, date, start_time, end_time, available, note, starts_at, ends_at, reason, id, business_id, created_at, updated_at FROM hours WHERE business_id IN managed
      - SELECT item_id, staff_id, client_id, frequency, interval, byday, monthly_by, count, until, status, id, business_id, created_at, updated_at FROM recurrences WHERE business_id IN managed
      - SELECT client_id, number, status, currency, subtotal_cents, tax_total_cents, total_cents, issued_at, due_at, overdue_notified_at, voided_at, notes, pay_token, id, business_id, created_at, updated_at, discount_kind, discount_value, discount_reason FROM invoices WHERE business_id IN managed
      - SELECT client_id, number, status, subtotal_cents, tax_total_cents, total_cents, valid_until, accepted_at, declined_at, converted_invoice_id, notes, decline_reason, view_token, id, business_id, created_at, updated_at, discount_kind, discount_value, discount_reason FROM estimates WHERE business_id IN managed
      - SELECT client_id, staff_id, number, status, currency, subtotal_cents, tax_total_cents, total_cents, receipt_email, receipt_phone, source, pickup_status, preparing_at, pickup_from, pickup_to, notify_sms, ready_at, picked_up_at, paid_at, note, receipt_channel, receipt_sent_at, id, business_id, created_at, updated_at, discount_kind, discount_value, discount_reason FROM orders WHERE business_id IN managed
      - SELECT estimate_id, invoice_id, order_id, description, item_id, booking_id, quantity, unit_amount_cents, amount_cents, tax_amount_cents, tax_class, position, staff_id, discount_cents, sale_discount_cents, for_pickup, optional, selected, id, business_id, created_at, updated_at, discount_kind, discount_value, discount_reason FROM lines WHERE business_id IN managed
      - SELECT item_id, line_id, reason, quantity, unit_cost_cents, note, created_by, id, business_id, created_at, updated_at FROM inventory WHERE business_id IN managed
      - SELECT client_id, kind, parent_payment_id, invoice_id, order_id, booking_id, amount_cents, currency, method, provider, reference, note, tendered_cents, status, paid_at, reason, credit_note, dispute_status, dispute_reason, dispute_respond_by, tip_cents, tip_split, id, business_id, created_at, updated_at FROM payments WHERE business_id IN managed
      - SELECT client_id, method, brand, last4, preferred, mandate_status, exp_month, exp_year, holder_name, bank_name, id, business_id, created_at, updated_at FROM payment_methods WHERE business_id IN managed
      - SELECT code, item_id, initial_cents, purchaser_client_id, recipient, expires_at, status, payment_id, id, business_id, created_at, updated_at FROM gift_cards WHERE business_id IN managed
      - SELECT owner_type, owner_id, category, code, currency, balance_cents, id, business_id, created_at, updated_at FROM accounts WHERE business_id IN managed
      - SELECT journal_id, account_id, owner_type, owner_id, amount_cents, currency, event, source_type, source_id, subject_type, subject_id, ref, leg, meta, occurred_at, available_at, created_at, id, business_id FROM entries WHERE business_id IN managed
      - SELECT client_id, booking_id, requested_at, id, business_id, created_at, updated_at FROM review_requests WHERE business_id IN managed
      - SELECT created_by, name, channel, body, audience, status, scheduled_at, recipient_count, excluded_count, id, business_id, created_at, updated_at FROM broadcasts WHERE business_id IN managed
      - SELECT form_id, client_id, parent_type, parent_id, status, submitted_at, opened_at, answers, id, business_id, created_at, updated_at FROM responses WHERE business_id IN managed
      - SELECT contract_id, client_id, parent_type, parent_id, token, signed_at, signed_body, ip, status, contract_version, opened_at, method, signer_name, strokes, id, business_id, created_at, updated_at FROM signatures WHERE business_id IN managed

  # A rolling window of history, subscribed by month (UTC): messages for every member, a member's own
  # visits and every visit for owner/admin. Older history is read from the API.
  history_shared:
    with:
      member: SELECT business_id FROM staff WHERE user_id = auth.user_id() AND status = 'active'
    queries:
      - SELECT thread_id, direction, channel, sent_by, body, status, broadcast_id, id, business_id, created_at, updated_at FROM messages WHERE business_id IN member AND substring(created_at, 1, 7) IN subscription.parameter('months')

  history_self:
    with:
      own: SELECT id FROM staff WHERE user_id = auth.user_id() AND status = 'active'
    queries:
      - SELECT item_id, staff_id, recurrence_id, starts_at, ends_at, capacity, status, id, business_id, created_at, updated_at FROM slots WHERE staff_id IN own AND substring(starts_at, 1, 7) IN subscription.parameter('months')
      - SELECT slot_id, starts_at, staff_id, client_id, subject_id, package_id, invoice_id, status, source, price_cents, deposit_amount_cents, deposit_status, confirmed_at, checked_in_at, order_id, charged_at, completed_at, canceled_at, reminded_at, reschedule_count, id, business_id, created_at, updated_at, deleted_at FROM bookings WHERE staff_id IN own AND deleted_at IS NULL AND substring(starts_at, 1, 7) IN subscription.parameter('months')

  history_full:
    with:
      managed: SELECT business_id FROM staff WHERE user_id = auth.user_id() AND status = 'active' AND role != 'staff' AND role != 'contractor'
    queries:
      - SELECT item_id, staff_id, recurrence_id, starts_at, ends_at, capacity, status, id, business_id, created_at, updated_at FROM slots WHERE business_id IN managed AND substring(starts_at, 1, 7) IN subscription.parameter('months')
      - SELECT slot_id, starts_at, staff_id, client_id, subject_id, package_id, invoice_id, status, source, price_cents, deposit_amount_cents, deposit_status, confirmed_at, checked_in_at, order_id, charged_at, completed_at, canceled_at, reminded_at, reschedule_count, id, business_id, created_at, updated_at, deleted_at FROM bookings WHERE business_id IN managed AND deleted_at IS NULL AND substring(starts_at, 1, 7) IN subscription.parameter('months')
