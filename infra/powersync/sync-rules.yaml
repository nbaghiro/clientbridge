# PowerSync Sync Rules = our row-level read authorization (the sync stream bypasses Postgres RLS).
# Employee model: staff see their OWN calendar + the shared client book; owner/admin see everything.
# See .docs/architecture.md. Writes are authorized separately in FastAPI /sync/upload.

bucket_definitions:
  # 1) SHARED: the catalog, the client book, forms and contracts, files and the inbox. Every active member.
  business_shared:
    parameters: |
      SELECT business_id FROM staff
      WHERE user_id = request.user_id() AND status = 'active'
    data:
      - SELECT * FROM clients         WHERE business_id = bucket.business_id AND deleted_at IS NULL
      - SELECT * FROM subjects        WHERE business_id = bucket.business_id AND deleted_at IS NULL
      - SELECT * FROM notes           WHERE business_id = bucket.business_id
      - SELECT * FROM consents        WHERE business_id = bucket.business_id
      - SELECT * FROM resources       WHERE business_id = bucket.business_id
      - SELECT * FROM hours           WHERE business_id = bucket.business_id AND staff_id IS NULL
      - SELECT * FROM items           WHERE business_id = bucket.business_id
      - SELECT * FROM packages        WHERE business_id = bucket.business_id
      - SELECT * FROM subscriptions   WHERE business_id = bucket.business_id
      - SELECT * FROM gift_cards      WHERE business_id = bucket.business_id
      - SELECT * FROM forms           WHERE business_id = bucket.business_id
      - SELECT * FROM fields          WHERE business_id = bucket.business_id
      - SELECT * FROM contracts       WHERE business_id = bucket.business_id
      - SELECT * FROM files           WHERE business_id = bucket.business_id
      - SELECT * FROM threads         WHERE business_id = bucket.business_id
      - SELECT * FROM messages        WHERE business_id = bucket.business_id

  # What staff and contractors read with fewer columns: the business without its tax numbers and
  # billing email, and the team without pay. Owner/admin read the same rows with more columns from
  # business_full, so no row reaches a device with two column sets.
  staff_limited:
    parameters:
      - SELECT business_id FROM staff WHERE user_id = request.user_id() AND status = 'active' AND role = 'staff'
      - SELECT business_id FROM staff WHERE user_id = request.user_id() AND status = 'active' AND role = 'contractor'
    data:
      - SELECT id, name, slug, timezone, locale, province, brand, stripe_account_id, stripe_terminal_location_id, stripe_charges_enabled, tax_registered, setup_dismissed_at, staff_discount_limit_bps FROM businesses WHERE id = bucket.business_id
      - SELECT id, business_id, user_id, role, name, title, color, status, invite_email, invited_at, created_at, updated_at FROM staff WHERE business_id = bucket.business_id
      # The pickup queue: paid online orders (pickup_status is set only once paid) and what to pack, without prices.
      - SELECT id, business_id, number, client_id, source, pickup_status, ready_at, picked_up_at, created_at, updated_at FROM orders WHERE business_id = bucket.business_id AND pickup_status IS NOT NULL
      - SELECT id, business_id, order_id, item_id, description, quantity, position, created_at, updated_at FROM lines WHERE business_id = bucket.business_id AND for_pickup = true

  # 2) STAFF-SELF — a staff member's OWN work + earnings, keyed to their staff row.
  #    (staff_id is denormalized onto bookings so it can be sliced here directly.)
  staff_self:
    parameters: |
      SELECT id AS staff_id, business_id FROM staff
      WHERE user_id = request.user_id() AND status = 'active'
    data:
      - SELECT * FROM slots              WHERE staff_id = bucket.staff_id AND business_id = bucket.business_id
      - SELECT * FROM bookings           WHERE staff_id = bucket.staff_id AND business_id = bucket.business_id AND deleted_at IS NULL
      - SELECT * FROM addons             WHERE staff_id = bucket.staff_id AND business_id = bucket.business_id
      - SELECT * FROM hours              WHERE staff_id = bucket.staff_id AND business_id = bucket.business_id
      - SELECT * FROM recurrences        WHERE staff_id = bucket.staff_id AND business_id = bucket.business_id
      - SELECT * FROM accounts           WHERE owner_type = 'staff' AND owner_id = bucket.staff_id AND business_id = bucket.business_id
      - SELECT * FROM entries            WHERE owner_type = 'staff' AND owner_id = bucket.staff_id AND business_id = bucket.business_id

  # 3) BUSINESS-FULL — owner/admin only: ALL members' work, financials and inbox.
  #    This is how an owner sees the activities of every worker.
  business_full:
    # Two parameter queries (owner, admin) — PowerSync parameter queries don't accept `IN (list)`;
    # their union = the businesses where the user is an owner OR admin.
    parameters:
      - SELECT business_id FROM staff WHERE user_id = request.user_id() AND status = 'active' AND role = 'owner'
      - SELECT business_id FROM staff WHERE user_id = request.user_id() AND status = 'active' AND role = 'admin'
    data:
      - SELECT id, name, slug, timezone, locale, province, billing_email, gst_hst_number, qst_number, pst_number, filing_frequency, review_hold_at, google_review_url, brand, stripe_account_id, stripe_terminal_location_id, stripe_charges_enabled, tax_registered, setup_dismissed_at, staff_discount_limit_bps FROM businesses WHERE id = bucket.business_id
      - SELECT id, business_id, user_id, role, name, payee, rate_type, rate_bps, rate_cents, retail_rate_bps, title, color, status, invite_email, invited_at, created_at, updated_at FROM staff WHERE business_id = bucket.business_id
      - SELECT * FROM slots              WHERE business_id = bucket.business_id
      - SELECT * FROM bookings           WHERE business_id = bucket.business_id AND deleted_at IS NULL
      - SELECT * FROM addons             WHERE business_id = bucket.business_id
      - SELECT * FROM hours              WHERE business_id = bucket.business_id
      - SELECT * FROM recurrences        WHERE business_id = bucket.business_id
      - SELECT * FROM invoices           WHERE business_id = bucket.business_id
      - SELECT * FROM estimates          WHERE business_id = bucket.business_id
      - SELECT * FROM orders             WHERE business_id = bucket.business_id
      - SELECT * FROM lines              WHERE business_id = bucket.business_id
      - SELECT * FROM inventory          WHERE business_id = bucket.business_id
      - SELECT * FROM payments           WHERE business_id = bucket.business_id
      - SELECT * FROM payment_methods    WHERE business_id = bucket.business_id
      - SELECT * FROM accounts           WHERE business_id = bucket.business_id
      - SELECT * FROM entries            WHERE business_id = bucket.business_id
      - SELECT * FROM reviews            WHERE business_id = bucket.business_id
      - SELECT * FROM broadcasts         WHERE business_id = bucket.business_id
      - SELECT * FROM responses          WHERE business_id = bucket.business_id
      - SELECT * FROM signatures         WHERE business_id = bucket.business_id
