services:
  postgres:
    image: postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    command: [postgres, -c, wal_level=logical]
    environment:
      POSTGRES_USER: verification
      POSTGRES_PASSWORD: verification
      POSTGRES_DB: clientbridge_test_sync
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U verification -d clientbridge_test_sync"]
      interval: 1s
      timeout: 3s
      retries: 30
  powersync:
    image: journeyapps/powersync-service@sha256:413a0c813e96935ebe7203b5759f8a594a7b7cd8aa42134713e63af637e0f079
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1::8080"]
    volumes:
      - ./powersync.yaml:/config/powersync.yaml:ro
      - ${SYNC_TEST_RULES:-../sync-rules.yaml}:/config/sync-rules.yaml:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    command: [start, -r, unified]
