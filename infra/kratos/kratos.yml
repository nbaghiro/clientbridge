# Dev config. Production overrides through env (see .docs/architecture.md, Identity).
version: v26.2.0

serve:
  public:
    base_url: http://localhost:8713/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:8700
        - http://localhost:8721   # web e2e (apps/web/playwright.config.ts)
        - http://localhost:8724   # web e2e, en-XA pseudo-locale
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers: [Accept, Content-Type, Cookie, X-Session-Token, X-CSRF-Token]
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:8700/
  allowed_return_urls:
    - http://localhost:8700
    - http://localhost:8721
    - http://localhost:8724
    - clientbridge://auth/callback

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: true
        ignore_network_errors: true
        min_password_length: 8
        identifier_similarity_check_enabled: true
    code:
      enabled: true
      config:
        lifespan: 15m
    totp:
      enabled: true
      config:
        issuer: Clientbridge
    lookup_secret:
      enabled: true
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          display_name: Clientbridge
          id: localhost
          origins:
            - http://localhost:8700
            - http://localhost:8721
            - http://localhost:8724
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            label: Google
            client_id: unset
            client_secret: unset
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope: [openid, email, profile]
            requested_claims:
              id_token:
                email: { essential: true }
                email_verified: { essential: true }

  flows:
    error:
      ui_url: http://localhost:8700/auth-error
    login:
      ui_url: http://localhost:8700/login
      lifespan: 10m
      style: unified
    registration:
      ui_url: http://localhost:8700/signup
      lifespan: 10m
      style: unified
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: session
    verification:
      enabled: true
      ui_url: http://localhost:8700/verify
      use: code
      after:
        default_browser_return_url: http://localhost:8700/
    recovery:
      enabled: true
      ui_url: http://localhost:8700/recover
      use: code
      after:
        hooks:
          - hook: revoke_active_sessions
    settings:
      ui_url: http://localhost:8700/setup/security
      privileged_session_max_age: 15m
      required_aal: highest_available
      after:
        password:
          hooks:
            - hook: revoke_active_sessions
    logout:
      after:
        default_browser_return_url: http://localhost:8700/login

session:
  lifespan: 720h
  earliest_possible_extend: 24h
  cookie:
    same_site: Lax
  whoami:
    required_aal: highest_available

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

# The backend words and sends auth email (services/notifications.py); a non-2xx reply is retried.
courier:
  delivery_strategy: http
  http:
    request_config:
      url: http://host.docker.internal:8701/webhooks/kratos-courier
      method: POST
      body: file:///etc/config/kratos/courier.jsonnet
      auth:
        type: api_key
        config:
          name: X-Kratos-Secret
          value: unset
          in: header

hashers:
  algorithm: argon2

ciphers:
  algorithm: xchacha20-poly1305

log:
  level: info
  format: text
  leak_sensitive_values: false

feature_flags:
  use_continue_with_transitions: true
